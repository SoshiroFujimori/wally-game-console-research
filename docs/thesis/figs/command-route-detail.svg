<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="100%" height="100%" fill="white"/><rect x="20" y="80" width="660" height="430" fill="#E5EBF8" stroke="none" stroke-width="2"/><rect x="680" y="80" width="500" height="430" fill="#CCD9F1" stroke="none" stroke-width="2"/><text x="350.0" y="49.45" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">CPUCLK 20 MHz</text><text x="930.0" y="49.45" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">DDRCLK 100 MHz</text><rect x="45" y="155" width="180" height="110" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="135.0" y="202.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">CPU側</text><text x="135.0" y="236.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">既存バス経由</text><rect x="300" y="155" width="220" height="110" fill="#77A3DC" stroke="#231F20" stroke-width="2"/><text x="410.0" y="202.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">rasterix_apb</text><text x="410.0" y="236.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">形式を変換</text><rect x="605" y="135" width="190" height="200" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="700.0" y="209.35" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">非同期FIFO</text><text x="700.0" y="244.45" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">語を保存</text><text x="700.0" y="279.55" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">順序を保つ</text><rect x="900" y="155" width="250" height="110" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="1025.0" y="201.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">公式RasterIX</text><text x="1025.0" y="238.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">命令を実行</text><polyline points="225,185 300,185" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="300,185 288.0,190.0 288.0,180.0" fill="#231F20"/><text x="262.0" y="129.75" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">APB</text><polyline points="520,185 605,185" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="605,185 593.0,190.0 593.0,180.0" fill="#231F20"/><text x="562.5" y="132.7" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="22" font-weight="400" fill="#231F20">Stream</text><polyline points="795,185 900,185" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="900,185 888.0,190.0 888.0,180.0" fill="#231F20"/><text x="845.5" y="132.7" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="22" font-weight="400" fill="#231F20">Stream</text><polyline points="300,238 225,238" fill="none" stroke="#1673C3" stroke-width="2"/><polygon points="225,238 237.0,233.0 237.0,243.0" fill="#1673C3"/><polyline points="605,280 560,280 560,240 520,240" fill="none" stroke="#1673C3" stroke-width="2"/><polygon points="520,240 532.0,235.0 532.0,245.0" fill="#1673C3"/><polyline points="900,245 835,245 835,285 795,285" fill="none" stroke="#1673C3" stroke-width="2"/><polygon points="795,285 807.0,280.0 807.0,290.0" fill="#1673C3"/><text x="345.0" y="379.7" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">入口で受理する時刻はCPUCLKで決める</text><text x="345.0" y="413.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">PREADYはFIFO入口の受取可に対応</text><text x="930.0" y="377.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">出口で受理する時刻は</text><text x="930.0" y="411.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">DDRCLKで決める</text><text x="592.5" y="467.3" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="700" fill="#231F20">APB側もStream側も、一回の受理を成立条件で数える</text><text x="600.0" y="567.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">黒い矢印：命令データが進む向き　青い矢印：受取可が戻る向き</text><text x="600.0" y="601.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">StreamはAXI4-Stream。DDR3を読み書きするAXI接続とは別。</text></svg>