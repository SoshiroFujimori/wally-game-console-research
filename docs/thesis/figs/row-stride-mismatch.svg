<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="100%" height="100%" fill="white"/><text x="600.0" y="44.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="32" font-weight="700" fill="#231F20">一行の幅の約束が違うと、行の境界を取り違える</text><text x="600.0" y="105.15" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">仕組みを小さくした例：保存側は横 4 画素、表示側は横 8 画素と想定</text><text x="285.0" y="186.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="700" fill="#231F20">保存した二行</text><rect x="35" y="240" width="110" height="88" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="90.0" y="295.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="32" font-weight="400" fill="#231F20">0</text><rect x="145" y="240" width="110" height="88" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="200.0" y="295.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="32" font-weight="400" fill="#231F20">1</text><rect x="255" y="240" width="110" height="88" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="310.0" y="295.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="32" font-weight="400" fill="#231F20">2</text><rect x="365" y="240" width="110" height="88" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="420.0" y="295.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="32" font-weight="400" fill="#231F20">3</text><rect x="35" y="328" width="110" height="88" fill="#CCD9F1" stroke="#231F20" stroke-width="2"/><text x="90.0" y="383.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="32" font-weight="400" fill="#231F20">4</text><rect x="145" y="328" width="110" height="88" fill="#CCD9F1" stroke="#231F20" stroke-width="2"/><text x="200.0" y="383.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="32" font-weight="400" fill="#231F20">5</text><rect x="255" y="328" width="110" height="88" fill="#CCD9F1" stroke="#231F20" stroke-width="2"/><text x="310.0" y="383.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="32" font-weight="400" fill="#231F20">6</text><rect x="365" y="328" width="110" height="88" fill="#CCD9F1" stroke="#231F20" stroke-width="2"/><text x="420.0" y="383.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="32" font-weight="400" fill="#231F20">7</text><polyline points="490,325 603,325 603,425 690,425" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="690,425 678.0,430.0 678.0,420.0" fill="#231F20"/><text x="872.5" y="194.3" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">表示側は 8 個を集めて</text><text x="872.5" y="232.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">「一行分」として扱ってしまう</text><rect x="690" y="387" width="60" height="78" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="720.0" y="436.85" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="31" font-weight="400" fill="#231F20">0</text><rect x="750" y="387" width="60" height="78" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="780.0" y="436.85" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="31" font-weight="400" fill="#231F20">1</text><rect x="810" y="387" width="60" height="78" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="840.0" y="436.85" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="31" font-weight="400" fill="#231F20">2</text><rect x="870" y="387" width="60" height="78" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="900.0" y="436.85" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="31" font-weight="400" fill="#231F20">3</text><rect x="930" y="387" width="60" height="78" fill="#CCD9F1" stroke="#231F20" stroke-width="2"/><text x="960.0" y="436.85" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="31" font-weight="400" fill="#231F20">4</text><rect x="990" y="387" width="60" height="78" fill="#CCD9F1" stroke="#231F20" stroke-width="2"/><text x="1020.0" y="436.85" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="31" font-weight="400" fill="#231F20">5</text><rect x="1050" y="387" width="60" height="78" fill="#CCD9F1" stroke="#231F20" stroke-width="2"/><text x="1080.0" y="436.85" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="31" font-weight="400" fill="#231F20">6</text><rect x="1110" y="387" width="60" height="78" fill="#CCD9F1" stroke="#231F20" stroke-width="2"/><text x="1140.0" y="436.85" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="31" font-weight="400" fill="#231F20">7</text><text x="600.0" y="565.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">実機で描画の横幅を 320 にしても、表示側が 640 のままなら同じ種類のずれが起こる。</text><text x="600.0" y="602.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">画像の置き場所だけでなく、次の行へ進む幅もそろえる必要がある。</text></svg>