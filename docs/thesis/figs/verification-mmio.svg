ont-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">PRDATA → バス → CPUが読んだ値（例：101）</text><text x="600.0" y="614.75" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">回数のレジスタを読む。画像の画素を読み戻す操作ではない。</text></svg>