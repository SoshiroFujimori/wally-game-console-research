<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530"><rect width="100%" height="100%" fill="white"/><text x="600.0" y="37.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="32" font-weight="700" fill="#231F20">編集しただけでは、実機は変わらない</text><text x="22" y="88.15" text-anchor="start" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="700" fill="#1673C3">① ボールの移動量を変える：CPUが実行するプログラムを更新</text><rect x="30" y="113" width="320" height="116" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="190.0" y="162.3" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">ゲームのC++</text><text x="190.0" y="200.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">Breakout.hpp など</text><rect x="440" y="113" width="320" height="116" fill="#77A3DC" stroke="#231F20" stroke-width="2"/><text x="600.0" y="162.3" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">RISC-V向けに</text><text x="600.0" y="200.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">コンパイル</text><rect x="850" y="113" width="320" height="116" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="1010.0" y="162.3" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">実機の実行ファイル</text><text x="1010.0" y="200.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">を取り替えて起動</text><polyline points="350,172 436,172" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="436,172 424.0,177.0 424.0,167.0" fill="#231F20"/><polyline points="760,172 846,172" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="846,172 834.0,177.0 834.0,167.0" fill="#231F20"/><text x="25" y="287.15" text-anchor="start" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="700" fill="#1673C3">② CPUクロックを変える：FPGA内の回路設定を更新</text><rect x="30" y="312" width="320" height="116" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="190.0" y="361.3" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">クロック生成の設定</text><text x="190.0" y="399.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">Tcl など</text><rect x="440" y="312" width="320" height="116" fill="#77A3DC" stroke="#231F20" stroke-width="2"/><text x="600.0" y="361.3" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">IP・回路を再生成</text><text x="600.0" y="399.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">配置配線と時間解析</text><rect x="850" y="312" width="320" height="116" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="1010.0" y="361.3" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">新しい .bit を</text><text x="1010.0" y="399.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">FPGAへ書き込む</text><polyline points="350,370 436,370" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="436,370 424.0,375.0 424.0,365.0" fill="#231F20"/><polyline points="760,370 846,370" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="846,370 834.0,375.0 834.0,365.0" fill="#231F20"/><text x="600.0" y="493.95" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">周波数を伝えるソフトウェア側の設定も、実際の回路と一致させる。</text></svg>