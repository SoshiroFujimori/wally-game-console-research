<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670"><rect width="100%" height="100%" fill="white"/><text x="600.0" y="44.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="32" font-weight="700" fill="#231F20">regs[1] が命令口の 0x10080004 へ届くまで</text><text x="270.0" y="101.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="700" fill="#231F20">プログラムから見える住所</text><text x="937.5" y="101.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="700" fill="#231F20">CPU の物理アドレス</text><rect x="25" y="135" width="425" height="96" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="237.5" y="174.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">mmap が返す先頭 V</text><text x="237.5" y="211.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">regs：32 bit 単位のポインタ</text><rect x="735" y="135" width="420" height="96" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="945.0" y="174.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">命令口の領域の先頭</text><text x="945.0" y="211.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">0x10080000</text><polyline points="450,181 735,181" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="735,181 723.0,186.0 723.0,176.0" fill="#231F20"/><text x="592.5" y="147.95" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">Linux が対応付ける</text><rect x="25" y="311" width="425" height="110" fill="#CCD9F1" stroke="#231F20" stroke-width="2"/><text x="237.5" y="356.7" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="31" font-weight="400" fill="#231F20">regs[1]</text><text x="237.5" y="397.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="31" font-weight="400" fill="#231F20">V + 1 × 4 byte</text><rect x="735" y="311" width="420" height="110" fill="#CCD9F1" stroke="#231F20" stroke-width="2"/><text x="945.0" y="356.7" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="31" font-weight="400" fill="#231F20">0x10080000 + 4</text><text x="945.0" y="397.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="31" font-weight="400" fill="#231F20">= 0x10080004</text><polyline points="450,366 735,366" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="735,366 723.0,371.0 723.0,361.0" fill="#231F20"/><text x="230.0" y="283.95" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">32 bit の要素は 4 byte</text><text x="600.0" y="506.7" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">V はプログラム内で使う仮想アドレス。値を物理アドレスと決めつけない。</text><text x="600.0" y="543.1" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">regs の添字を 1 増やすと、住所は 1 byte ではなく 4 byte 進む。</text><text x="600.0" y="579.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">mmap の範囲は 4096 byte。実際のレジスタの領域は 256 byte。</text><text x="600.0" y="615.9" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">対応付けた範囲のすべてに、レジスタがあるわけではない。</text></svg>