<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="100%" height="100%" fill="white"/><text x="600.0" y="44.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="32" font-weight="700" fill="#231F20">配列を読む位置と、命令を書く番地は別々に考える</text><text x="600.0" y="104.8" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">転送範囲：offset = 8 byte、size = 12 byte、要素は 32 bit（4 byte）</text><text x="265.0" y="174.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="700" fill="#231F20">CPU 側の配列</text><text x="952.5" y="174.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="700" fill="#231F20">周辺回路の命令口</text><rect x="25" y="203" width="440" height="59" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="245.0" y="242.3" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">要素 [0]　先頭から 0 byte</text><rect x="25" y="262" width="440" height="59" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="245.0" y="301.3" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">要素 [1]　先頭から 4 byte</text><rect x="25" y="321" width="440" height="59" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="245.0" y="360.3" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">要素 [2]　先頭から 8 byte</text><rect x="25" y="380" width="440" height="59" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="245.0" y="419.3" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">要素 [3]　先頭から 12 byte</text><rect x="25" y="439" width="440" height="59" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="245.0" y="478.3" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">要素 [4]　先頭から 16 byte</text><rect x="760" y="270" width="415" height="85" fill="#CCD9F1" stroke="#231F20" stroke-width="2"/><text x="967.5" y="322.65" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">CMD  0x10080000</text><rect x="760" y="446" width="415" height="85" fill="#CCD9F1" stroke="#231F20" stroke-width="2"/><text x="967.5" y="498.65" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">CMD_LAST  0x10080004</text><polyline points="465,350 600,350 600,292 760,292" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="760,292 748.0,297.0 748.0,287.0" fill="#231F20"/><polyline points="465,409 645,409 645,334 760,334" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="760,334 748.0,339.0 748.0,329.0" fill="#231F20"/><polyline points="465,468 760,488" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="760,488 747.689276895904,492.1768524817469 748.3656902532719,482.19975546057015" fill="#231F20"/><text x="600.0" y="557.1" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">要素 [2]、[3]、[4] を順に読む。最初の二語は同じ CMD へ書く。</text><text x="600.0" y="593.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">配列の番地は進むが、命令口の番地を語ごとに増やすわけではない。</text></svg>