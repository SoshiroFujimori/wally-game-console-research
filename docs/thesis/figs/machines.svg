<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590"><rect width="100%" height="100%" fill="white"/><rect x="365" y="15" width="470" height="90" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="600.0" y="51.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">開発用パソコン</text><text x="600.0" y="88.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">編集・生成・文字の送受信</text><rect x="55" y="275" width="680" height="235" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="390.0" y="312.15" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="700" fill="#231F20">Nexys Video（ゲームを動かす機械）</text><rect x="90" y="355" width="610" height="115" fill="#CCD9F1" stroke="#231F20" stroke-width="2"/><text x="395.0" y="404.1" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">FPGA内のWallyと描画・表示回路</text><text x="395.0" y="440.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">ここでゲームを実行する</text><polyline points="410,105 410,185 195,185 195,275" fill="none" stroke="#1673C3" stroke-width="2"/><polygon points="195,275 190.0,263.0 200.0,263.0" fill="#1673C3"/><text x="210.0" y="157.3" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#1673C3">回路の設定</text><text x="197.5" y="249.8" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">USB PROG</text><polyline points="695,105 695,190 580,190 580,275" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="580,275 575.0,263.0 585.0,263.0" fill="#231F20"/><polyline points="610,275 610,215 725,215 725,105" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="725,105 730.0,117.0 720.0,117.0" fill="#231F20"/><text x="932.5" y="171.8" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">文字の出力・キー入力</text><text x="434.5" y="255.3" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">USB UART</text><rect x="890" y="343" width="275" height="150" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="1027.5" y="409.9" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">映像を受ける機器</text><text x="1027.5" y="445.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">ディスプレイなど</text><polyline points="735,415 890,415" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="890,415 878.0,420.0 878.0,410.0" fill="#231F20"/><text x="812.0" y="354.9" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">HDMI</text><text x="812.0" y="390.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">OUT</text><text x="600.0" y="563.95" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">線は用途を区別した接続経路。パソコンで映像を取り込む場合も、ゲームの計算はFPGA側。</text></svg>