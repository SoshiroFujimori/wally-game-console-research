<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510"><rect width="100%" height="100%" fill="white"/><text x="600.0" y="46.15" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="700" fill="#231F20">色を覚える呼出しと初期化を依頼する呼出し</text><text x="195.0" y="131.25" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="700" fill="#231F20">元の描画先</text><rect x="35" y="165" width="320" height="180" fill="#000000" stroke="#231F20" stroke-width="2"/><text x="600.0" y="131.25" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="700" fill="#231F20">色を黒に設定した段階</text><rect x="440" y="165" width="320" height="180" fill="#000000" stroke="#231F20" stroke-width="2"/><text x="1005.0" y="131.25" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="700" fill="#231F20">初期化が実行された後</text><rect x="845" y="165" width="320" height="180" fill="#000000" stroke="#231F20" stroke-width="2"/><rect x="105" y="215" width="180" height="30" fill="#ff0000" stroke="#ff0000" stroke-width="2"/><rect x="510" y="215" width="180" height="30" fill="#ff0000" stroke="#ff0000" stroke-width="2"/><polyline points="355,255 440,255" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="440,255 428.0,260.0 428.0,250.0" fill="#231F20"/><polyline points="760,255 845,255" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="845,255 833.0,260.0 833.0,250.0" fill="#231F20"/><text x="552.5" y="378.8" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="24" font-weight="400" fill="#231F20">glClearColor(0, 0, 0, 1)</text><text x="552.5" y="410.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="24" font-weight="400" fill="#231F20">初期化に使う色を記憶</text><text x="997.5" y="378.8" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="24" font-weight="400" fill="#231F20">glClear(...)</text><text x="997.5" y="410.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="24" font-weight="400" fill="#231F20">色の領域の初期化を依頼</text><text x="600.0" y="476.25" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#1673C3">描画先へ反映する処理は、用意した命令が実行されて進む</text></svg>