<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="535" viewBox="0 0 1200 535"><rect width="100%" height="100%" fill="white"/><text x="195.0" y="52.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="700" fill="#231F20">① RTLの記述</text><rect x="20" y="85" width="350" height="220" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="195.0" y="186.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="400" fill="#231F20">条件を組み合わせる</text><text x="195.0" y="225.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="400" fill="#231F20">値を保存する</text><text x="605.0" y="52.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="700" fill="#231F20">② FPGA内の回路</text><rect x="430" y="85" width="350" height="220" fill="#CCD9F1" stroke="#231F20" stroke-width="2"/><text x="605.0" y="166.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="400" fill="#231F20">LUT：条件・計算</text><text x="605.0" y="205.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="400" fill="#231F20">FF：bitを保持</text><text x="605.0" y="244.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="400" fill="#231F20">配線：部品を接続</text><text x="1020.0" y="52.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="700" fill="#231F20">③ 実物へ設定</text><rect x="860" y="85" width="320" height="220" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="1020.0" y="166.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="400" fill="#231F20">配置と配線を決定</text><text x="1020.0" y="205.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="