<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490"><rect width="100%" height="100%" fill="white"/><text x="600.0" y="44.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="32" font-weight="700" fill="#231F20">データ幅 64 bit と 16 bit は、見る場所が違う</text><text x="280.0" y="96.3" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">FPGA 内部の 64 bit 幅のデータ</text><rect x="35" y="137" width="124" height="91" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="97.0" y="174.1" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">A</text><text x="97.0" y="210.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">16 bit</text><rect x="159" y="137" width="124" height="91" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="221.0" y="174.1" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">B</text><text x="221.0" y="210.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">16 bit</text><rect x="283" y="137" width="124" height="91" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="345.0" y="174.1" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">C</text><text x="345.0" y="210.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">16 bit</text><rect x="407" y="137" width="124" height="91" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="469.0" y="174.1" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">D</text><text x="469.0" y="210.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">16 bit</text><rect x="625" y="137" width="230" height="91" fill="#CCD9F1" stroke="#231F20" stroke-width="2"/><text x="740.0" y="174.1" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">MIG</text><text x="740.0" y="210.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">DDR3 制御</text><polyline points="531,183 625,183" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="625,183 613.0,188.0 613.0,178.0" fill="#231F20"/><rect x="983" y="137" width="185" height="91" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="1075.5" y="174.1" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">DDR3</text><text x="1075.5" y="210.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">DQ 16 本</text><polyline points="855,183 983,183" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="983,183 971.0,188.0 971.0,178.0" fill="#231F20"/><text x="1008.0" y="270.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">一回のデータ転送で</text><text x="1008.0" y="304.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">16 bit を扱う配線</text><text x="600.0" y="368.4" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">A〜D は、一つの 64 bit を四つの 16 bit に分けて見た模式図。</text><text x="600.0" y="404.79999999999995" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">MIG が内部の要求と、DDR3 の転送・タイミングを仲介する。</text><text x="600.0" y="441.19999999999993" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">「CPU が必ず 4 クロック待つ」と表す図ではない。</text></svg>