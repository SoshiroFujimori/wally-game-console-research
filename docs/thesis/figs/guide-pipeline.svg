<text x="50" y="520" font-size="23" text-anchor="start" font-weight="normal">F：命令取得　D：解読　E：実行　M：メモリアクセス　W：結果の保存</text>
<text x="50" y="552" font-size="23" text-anchor="start" font-weight="normal">同じ縦列では、別々の命令の別々の段が同時に働いている。</text>
<text x="40" y="636" font-size="19" text-anchor="start" font-weight="normal">停止・依存・分岐・キャッシュミスのない説明例。Wallyの実測スケジュールではない。</text>
