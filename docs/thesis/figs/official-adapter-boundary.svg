<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="100%" height="100%" fill="white"/><text x="600.0" y="44.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="32" font-weight="700" fill="#231F20">公式 RasterIX を変えず、接続の両側を Wally に合わせる</text><text x="595.0" y="97.65" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="700" fill="#231F20">CPU が実行するソフトウェア</text><rect x="25" y="125" width="350" height="105" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="200.0" y="169.1" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">公式 RasterIX</text><text x="200.0" y="205.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">描画ライブラリ</text><rect x="475" y="125" width="410" height="105" fill="#CCD9F1" stroke="#231F20" stroke-width="2"/><text x="680.0" y="169.1" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">WallyBusConnector</text><text x="680.0" y="205.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">Wally 側で実装</text><polyline points="375,177 475,177" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="475,177 463.0,182.0 463.0,172.0" fill="#231F20"/><text x="497.5" y="269.25" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">既定の接続インタフェース</text><text x="1025.0" y="194.8" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">MMIO で送信</text><polyline points="885,215 1000,215 1000,324 837,324 837,387" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="837,387 832.0,375.0 842.0,375.0" fill="#231F20"/><text x="285.0" y="349.15" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="700" fill="#231F20">FPGA 内で働く回路</text><rect x="680" y="387" width="470" height="110" fill="#CCD9F1" stroke="#231F20" stroke-width="2"/><text x="915.0" y="433.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">rasterix_apb + FIFO</text><text x="915.0" y="470.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">バスの要求を命令列へ変換</text><rect x="25" y="387" width="495" height="110" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="272.5" y="433.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="400" fill="#231F20">公式 RasterIX_IF</text><text x="272.5" y="472.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="400" fill="#231F20">命令列を受けて描画</text><polyline points="680,442 520,442" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="520,442 532.0,437.0 532.0,447.0" fill="#231F20"/><text x="600.0" y="565.1" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">淡い箱は公式のソフトウェア／回路。濃い箱は Wally 側の接続部分。</text><text x="600.0" y="601.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">矢印は描画命令が進む向き。画像メモリと表示の経路は第 10 章で追う。</text></svg>