<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410"><rect width="100%" height="100%" fill="white"/><text x="600.0" y="43.849999999999994" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="31" font-weight="700" fill="#231F20">一つの画素の色を、16 bitに詰める</text><rect x="90" y="130" width="318.75" height="90" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="249.375" y="185.85" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="31" font-weight="400" fill="#231F20">赤 5 bit</text><rect x="408.75" y="130" width="382.5" height="90" fill="#CCD9F1" stroke="#231F20" stroke-width="2"/><text x="600.0" y="185.85" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="31" font-weight="400" fill="#231F20">緑 6 bit</text><rect x="791.25" y="130" width="318.75" height="90" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="950.625" y="185.85" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="31" font-weight="400" fill="#231F20">青 5 bit</text><text x="249.375" y="113.75" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">bit 15 ～ 11</text><text x="600.0" y="113.75" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">bit 10 ～ 5</text><text x="950.625" y="113.75" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">bit 4 ～ 0</text><text x="250.0" y="264.8" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">0 ～ 31</text><text x="600.0" y="264.8" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">0 ～ 63</text><text x="950.0" y="264.8" text-anchor="middle" font-family="Arial,Noto Sans J