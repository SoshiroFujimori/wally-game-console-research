<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540"><rect width="100%" height="100%" fill="white"/><text x="600.0" y="53.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="700" fill="#231F20">説明用の時刻で、CPUと描画回路の動きをそろえて読む</text><text x="142.5" y="202.65" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="700" fill="#231F20">CPUの処理</text><text x="142.5" y="347.65" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="700" fill="#231F20">描画回路</text><polyline points="270,125 1080,125" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="1080,125 1068.0,130.0 1068.0,120.0" fill="#231F20"/><polyline points="270,115 270,405" fill="none" stroke="#929292" stroke-width="2" stroke-dasharray="10 7"/><text x="270.0" y="103.75" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">0 ms</text><polyline points="450,115 450,405" fill="none" stroke="#929292" stroke-width="2" stroke-dasharray="10 7"/><text x="450.0" y="103.75" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">2 ms</text><polyline points="720,115 720,405" fill="none" stroke="#929292" stroke-width="2" stroke-dasharray="10 7"/><text x="720.0" y="103.75" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">5 ms</text><polyline points="990,115 990,405" fill="none" stroke="#929292" stroke-width="2" stroke-dasharray="10 7"/><text x="990.0" y="103.75" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">8 ms</text><rect x="270" y="165" width="450" height="85" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="495.0" y="217.3" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">命令を送る　5 ms</text><rect x="720" y="165" width="270" height="85" fill="#CCD9F1" stroke="#231F20" stroke-width="2"/><text x="855.0" y="216.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">完了を待つ　3 ms</text><rect x="450" y="310" width="540" height="85" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="720.0" y="362.3" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">受け取った命令で描画する　6 ms</text><text x="585.0" y="285.75" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="700" fill="#1673C3">この間は同時に進む</text><text x="600.0" y="464.9" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">CPUの待ち3 ms ≠ 描画回路の実行6 ms</text><text x="600.0" y="500.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">数値は説明用。実機の完了待ちには表示切り替えも含まれる。</text></svg>