<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550"><rect width="100%" height="100%" fill="white"/><text x="600.0" y="46.15" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="700" fill="#231F20">左上の位置と幅と高さから四隅を求める</text><rect x="30" y="130" width="360" height="245" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="210.0" y="204.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="400" fill="#231F20">左上  (44, 76)</text><text x="210.0" y="243.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="400" fill="#231F20">幅 62</text><text x="210.0" y="282.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="400" fill="#231F20">高さ 18</text><text x="210.0" y="321.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="400" fill="#231F20">色 赤</text><polyline points="390,250 515,250" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="515,250 503.0,255.0 503.0,245.0" fill="#231F20"/><rect x="595" y="185" width="430" height="150" fill="#ff0000" stroke="#231F20" stroke-width="2"/><text x="612.5" y="148.75" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="700" fill="#231F20">P0 (44, 76)</text><text x="1042.5" y="148.75" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="700" fill="#231F20">P1 (106, 76)</text><text x="1042.5" y="383.75" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="700" fill="#231F20">P2 (106, 94)</text><text x="612.5" y="383.75" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="700" fill="#231F20">P3 (44, 94)</text><text x="827.5" y="456.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">右端 = 44 + 62 = 106</text><text x="827.5" y="493.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">下端 = 76 + 18 = 94</text><text x="220.0" y="464.7" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="700" fill="#1673C3">P0 → P1 → P2 → P3</text><text x="220.0" y="498.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="700" fill="#1673C3">周囲をたどる順で渡す</text></svg>