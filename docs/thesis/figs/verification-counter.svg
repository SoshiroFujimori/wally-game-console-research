<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="100%" height="100%" fill="white"/><text x="600.0" y="37.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="700" fill="#231F20">現在の回数を保持するか、1を足した回数を保存するか</text><rect x="855" y="180" width="220" height="160" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="965.0" y="251.9" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">FrameCount</text><text x="965.0" y="287.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">32 bit</text><polygon points="855,314 868,322 855,330" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><polyline points="831,322 855,322" fill="none" stroke="#231F20" stroke-width="2"/><text x="951.0" y="369.7" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="22" font-weight="400" fill="#231F20">CPUCLK</text><text x="835.0" y="251.25" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">D</text><text x="1095.0" y="251.25" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">Q</text><polygon points="600,155 705,190 705,330 600,365" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="651.5" y="266.1" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">MUX</text><text x="621.0" y="206.25" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">0</text><text x="621.0" y="336.25" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">1</text><polyline points="705,260 855,260" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="855,260 843.0,265.0 843.0,255.0" fill="#231F20"/><polyline points="1075,260 1160,260 1160,85 75,85 75,205 600,205" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="600,205 588.0,210.0 588.0,200.0" fill="#231F20"/><text x="455.0" y="127.8" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">Q：現在の回数（例：100）</text><text x="360.0" y="185.1" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">そのまま保持する経路</text><ellipse cx="75.0" cy="205.0" rx="5.0" ry="5.0" fill="#231F20" stroke="#231F20" stroke-width="2"/><polyline points="75,205 75,445 285,445" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="285,445 273.0,450.0 273.0,440.0" fill="#231F20"/><rect x="285" y="395" width="180" height="100" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="375.0" y="436.9" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">+ 1</text><text x="375.0" y="472.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">加算器</text><polyline points="465,445 540,445 540,315 600,315" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="600,315 588.0,320.0 588.0,310.0" fill="#231F20"/><text x="166.0" y="491.75" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">100を入力</text><text x="540.0" y="493.25" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">101を出力</text><polyline points="650,510 650,349" fill="none" stroke="#1673C3" stroke-width="2"/><polygon points="650,349 655.0,361.0 645.0,361.0" fill="#1673C3"/><text x="717.5" y="545.8" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#1673C3">FrameDone</text><text x="980.0" y="463.4" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">通知が0 → Dは100</text><text x="980.0" y="498.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">通知が1 → Dは101</text><text x="600.0" y="608.75" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">Dを保存するのはクロックの立ち上がり。リセット時は0を保存する。</text></svg>