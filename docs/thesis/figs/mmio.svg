<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="445" viewBox="0 0 1200 445"><rect width="100%" height="100%" fill="white"/><rect x="20" y="143" width="255" height="130" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="147.5" y="199.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="400" fill="#231F20">CPUの書き込み</text><text x="147.5" y="238.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="400" fill="#231F20">番地と値</text><polyline points="275,208 365,208 365,105 620,105" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="620,105 608.0,110.0 608.0,100.0" fill="#231F20"/><polyline points="365,208 365,308 620,308" fill="none" stroke="#1673C3" stroke-width="2"/><polygon points="620,308 608.0,313.0 608.0,303.0" fill="#1673C3"/><text x="487.0" y="83.8" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">普通のRAM宛て</text><text x="485.0" y="278.95" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#1673C3">命令口の番地宛て</text><rect x="620" y="35" width="550" height="140" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="895.0" y="96.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="400" fill="#231F20">メモリ内の指定した場所</text><text x="895.0" y="135.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="400" fill="#231F20">値を保存する</text><rect x="620" y="238" width="550" height="140" fill="#CCD9F1" stroke="#231F20" stroke-width="2"/><text x="895.0" y="299.3" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">APB接続 → FIFOへデータを渡す</text><text x="895.0" y="337.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">装置への操作になる</text><text x="600.0" y="418.95" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">同じ「番地へ書く」操作でも、その番地につながる相手によって意味が変わる。</text></svg>