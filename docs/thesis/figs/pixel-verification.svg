<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"><rect width="100%" height="100%" fill="white"/><rect x="320" y="30" width="560" height="85" fill="#CCD9F1" stroke="#231F20" stroke-width="2"/><text x="600.0" y="82.3" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">同じゲーム状態と図形・文字の定義</text><polyline points="450,115 450,170 265,170 265,210" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="265,210 260.0,198.0 270.0,198.0" fill="#231F20"/><polyline points="750,115 750,170 950,170 950,210" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="950,210 945.0,198.0 955.0,198.0" fill="#231F20"/><rect x="30" y="210" width="470" height="110" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="265.0" y="256.3" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">CPU側の塗りつぶし処理</text><text x="265.0" y="294.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">期待画像を作る</text><rect x="715" y="210" width="455" height="110" fill="#77A3DC" stroke="#231F20" stroke-width="2"/><text x="942.5" y="256.3" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">RasterIXで描画</text><text x="942.5" y="294.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">実機メモリから画像を読む</text><polyline points="265,320 265,377 505,377" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="505,377 493.0,382.0 493.0,372.0" fill="#231F20"/><polyline points="950,320 950,377 695,377" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="695,377 707.0,372.0 707.0,382.0" fill="#231F20"/><rect x="485" y="345" width="230" height="110" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="600.0" y="391.3" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">画素を比較</text><text x="600.0" y="429.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">307,200個</text><text x="600.0" y="500.9" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">描画処理は別々、ゲーム状態や図形の定義は共通。</text><text x="600.0" y="536.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">ゲームの規則そのものの正しさは、別の確認も必要になる。</text></svg>