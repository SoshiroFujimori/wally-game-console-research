<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710"><rect width="100%" height="100%" fill="white"/><text x="600.0" y="44.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="32" font-weight="700" fill="#231F20">同じ 4:3 の画像でも、表示時の伸ばし方で形が変わる</text><text x="595.0" y="102.3" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">元画像は 640 × 480。図中の青い図形は、元画像では正方形。</text><text x="290.0" y="180.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="700" fill="#231F20">画面全体へ引き伸ばす</text><rect x="30" y="221" width="520" height="293" fill="#231F20" stroke="#231F20" stroke-width="2"/><rect x="32" y="223" width="516" height="289" fill="#E5EBF8" stroke="#E5EBF8" stroke-width="2"/><rect x="207" y="314" width="166" height="125" fill="#1673C3" stroke="#1673C3" stroke-width="2"/><text x="910.0" y="180.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="700" fill="#231F20">縦横比 4:3 を保つ</text><rect x="650" y="221" width="520" height="293" fill="#231F20" stroke="#231F20" stroke-width="2"/><rect x="715" y="223" width="390" height="289" fill="#E5EBF8" stroke="#E5EBF8" stroke-width="2"/><rect x="848" y="314" width="125" height="125" fill="#1673C3" stroke="#1673C3" stroke-width="2"/><text x="290.0" y="566.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">画像部分 1920 × 1080</text><text x="290.0" y="603.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">縦 2.25 倍、横 3 倍</text><text x="910.0" y="566.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">画像部分 1440 × 1080</text><text x="910.0" y="603.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">縦も横も 2.25 倍</text><text x="600.0" y="665.95" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">右側では、1920 − 1440 = 480 画素を左右 240 画素ずつの余白にする。</text></svg>