<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="555" viewBox="0 0 1200 555"><rect width="100%" height="100%" fill="white"/><text x="600.0" y="36.849999999999994" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="31" font-weight="700" fill="#231F20">Bへ切り替える設定をしても、Aの返事は残ることがある</text><text x="25" y="97.65" text-anchor="start" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="700" fill="#231F20">早過ぎる再利用</text><rect x="20" y="120" width="350" height="118" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="195.0" y="170.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">Aを読む要求</text><text x="195.0" y="207.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">返事はまだ来ていない</text><rect x="405" y="120" width="350" height="118" fill="#77A3DC" stroke="#231F20" stroke-width="2"/><text x="580.0" y="170.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">表示先をBへ変更</text><text x="580.0" y="207.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">すぐAへ描き始める</text><rect x="795" y="120" width="350" height="118" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="970.0" y="170.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">残ったAの読み出しが</text><text x="970.0" y="207.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">新しい色を拾うおそれ</text><polyline points="370,180 401,180" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="401,180 389.0,185.0 389.0,175.0" fill="#231F20"/><polyline points="755,180 786,180" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="786,180 774.0,185.0 774.0,175.0" fill="#231F20"/><text x="25" y="314.65" text-anchor="start" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="700" fill="#1673C3">本実装での再利用</text><rect x="20" y="338" width="350" height="118" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="195.0" y="388.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">Aの返事が残る間は</text><text x="195.0" y="425.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">Aへの再描画を待つ</text><rect x="405" y="338" width="350" height="118" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="580.0" y="388.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">旧Aと新Bの先頭の</text><text x="580.0" y="425.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">読み出しの返事を確認</text><rect x="795" y="338" width="350" height="118" fill="#77A3DC" stroke="#231F20" stroke-width="2"/><text x="970.0" y="388.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">完了を返す</text><text x="970.0" y="425.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">Aを次の描画へ使える</text><polyline points="370,397 401,397" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="401,397 389.0,402.0 389.0,392.0" fill="#231F20"/><polyline points="755,397 786,397" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="786,397 774.0,402.0 774.0,392.0" fill="#231F20"/><text x="600.0" y="527.3" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">青い箱：旧画像Aの再利用を許す時点。矢印は出来事の順序。</text></svg>