<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="100%" height="100%" fill="white"/><text x="600.0" y="44.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="32" font-weight="700" fill="#231F20">APB 変換回路は、同時に存在する選択回路と記憶回路でできている</text><text x="600.0" y="99.65" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">①〜③ は読むための分け方。ソフトウェアの実行順ではない。</text><rect x="25" y="146" width="340" height="110" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="195.0" y="210.45" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">PADDR・PWDATA</text><rect x="480" y="146" width="440" height="110" fill="#CCD9F1" stroke="#231F20" stroke-width="2"/><text x="700.0" y="210.8" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">① 32 bit のデータを選ぶ</text><text x="1085.0" y="211.65" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="700" fill="#231F20">CmdData</text><polyline points="365,201 480,201" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="480,201 468.0,206.0 468.0,196.0" fill="#231F20"/><polyline points="920,201 978,201" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="978,201 966.0,206.0 966.0,196.0" fill="#231F20"/><rect x="25" y="309" width="340" height="110" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="195.0" y="355.9" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">命令書込み／応答読出し</text><text x="195.0" y="391.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">CmdReady／RespValid</text><rect x="480" y="309" width="440" height="110" fill="#CCD9F1" stroke="#231F20" stroke-width="2"/><text x="700.0" y="373.8" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">② 待つ条件を選ぶ</text><text x="1085.0" y="374.65" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="700" fill="#231F20">PREADY</text><polyline points="365,364 480,364" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="480,364 468.0,369.0 468.0,359.0" fill="#231F20"/><polyline points="920,364 978,364" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="978,364 966.0,369.0 966.0,359.0" fill="#231F20"/><rect x="25" y="472" width="340" height="110" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="195.0" y="518.9" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">FrameDone</text><text x="195.0" y="554.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">FrameAddr・クロック</text><rect x="480" y="472" width="440" height="110" fill="#CCD9F1" stroke="#231F20" stroke-width="2"/><text x="700.0" y="518.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">③ 状態を保存する</text><text x="700.0" y="555.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">FrameCount・DisplayAddr</text><text x="1085.0" y="537.65" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="700" fill="#231F20">読出し値へ</text><polyline points="365,527 480,527" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="480,527 468.0,532.0 468.0,522.0" fill="#231F20"/><polyline points="920,527 978,527" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="978,527 966.0,532.0 966.0,522.0" fill="#231F20"/></svg>