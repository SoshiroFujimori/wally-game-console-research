<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580"><rect width="100%" height="100%" fill="white"/><text x="600.0" y="44.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="32" font-weight="700" fill="#231F20">ブロックに当たった事実を、次に描く図形へ反映する</text><rect x="25" y="105" width="330" height="225" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="190.0" y="152.25" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">① Game::step</text><text x="190.0" y="189.95" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20"></text><text x="190.0" y="227.64999999999998" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">衝突を判定する</text><text x="190.0" y="265.34999999999997" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">ブロックを消す</text><text x="190.0" y="303.04999999999995" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">得点を増やす</text><rect x="435" y="105" width="330" height="225" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="600.0" y="152.25" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">② Scene</text><text x="600.0" y="189.95" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20"></text><text x="600.0" y="227.64999999999998" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">残ったブロック</text><text x="600.0" y="265.34999999999997" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">ボールの新しい位置</text><text x="600.0" y="303.04999999999995" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">更新後の得点</text><rect x="845" y="105" width="330" height="225" fill="#CCD9F1" stroke="#231F20" stroke-width="2"/><text x="1010.0" y="152.25" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">③ Renderer</text><text x="1010.0" y="189.95" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20"></text><text x="1010.0" y="227.64999999999998" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">四角形を指定する</text><text x="1010.0" y="265.34999999999997" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">文字を指定する</text><text x="1010.0" y="303.04999999999995" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">描画命令を準備する</text><polyline points="355,217 435,217" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="435,217 423.0,222.0 423.0,212.0" fill="#231F20"/><polyline points="765,217 845,217" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="845,217 833.0,222.0 833.0,212.0" fill="#231F20"/><text x="600.0" y="404.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">例：ブロックが一個消えたら、そのブロックを次の Scene に含めない。</text><text x="600.0" y="440.59999999999997" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">同じ Scene でも、個別描画・まとめ描画・部分描画という描き方を選べる。</text><text x="600.0" y="476.99999999999994" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">ゲームの規則と、規則の結果を画面へ反映する描き方を分けている。</text><text x="600.0" y="513.4" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">ここに描いた三つは、いずれも CPU 上で行う処理である。</text></svg>