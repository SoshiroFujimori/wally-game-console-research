<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><rect width="100%" height="100%" fill="white"/><rect x="30" y="35" width="340" height="155" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="200.0" y="84.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="400" fill="#231F20">CPU</text><text x="200.0" y="123.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="400" fill="#231F20">次の命令データを</text><text x="200.0" y="162.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="400" fill="#231F20">送りたい</text><rect x="820" y="35" width="350" height="155" fill="#CCD9F1" stroke="#231F20" stroke-width="2"/><text x="995.0" y="103.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="400" fill="#231F20">命令FIFO</text><text x="995.0" y="142.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="400" fill="#231F20">満杯で受け取れない</text><rect x="820" y="348" width="350" height="170" fill="#CCD9F1" stroke="#231F20" stroke-width="2"/><text x="995.0" y="404.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="400" fill="#231F20">RasterIX</text><text x="995.0" y="443.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="400" fill="#231F20">メモリへの処理を</text><text x="995.0" y="482.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="400" fill="#231F20">終えたい</text><rect x="30" y="348" width="340" height="170" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="200.0" y="404.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="400" fill="#231F20">共有メモリ経路</text><text x="200.0" y="443.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="400" fill="#231F20">CPU側の処理を</text><text x="200.0" y="482.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="400" fill="#231F20">待つ条件</text><polyline points="370,110 820,110" fill="none" stroke="#1673C3" stroke-width="2"/><polygon points="820,110 808.0,115.0 808.0,105.0" fill="#1673C3"/><text x="592.5" y="79.65" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">空きができるのを待つ</text><polyline points="995,190 995,348" fill="none" stroke="#1673C3" stroke-width="2"/><polygon points="995,348 990.0,336.0 1000.0,336.0" fill="#1673C3"/><text x="860.0" y="248.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">命令の処理が</text><text x="860.0" y="285.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">進むのを待つ</text><polyline points="820,430 370,430" fill="none" stroke="#1673C3" stroke-width="2"/><polygon points="370,430 382.0,425.0 382.0,435.0" fill="#1673C3"/><text x="592.5" y="403.65" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">メモリの応答を待つ</text><polyline points="195,348 195,190" fill="none" stroke="#1673C3" stroke-width="2"/><polygon points="195,190 200.0,202.0 190.0,202.0" fill="#1673C3"/><text x="395.0" y="248.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">CPU側が終わるのを</text><text x="395.0" y="285.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">待つ条件と重なる</text><text x="600.0" y="573.95" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">矢印は「相手を待つ」の意味。この条件が輪になると、全員が先へ進めなくなる。</text></svg>