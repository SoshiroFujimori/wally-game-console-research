<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="625" viewBox="0 0 1200 625"><rect width="100%" height="100%" fill="white"/><text x="600.0" y="43.349999999999994" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="31" font-weight="700" fill="#231F20">「バッファ」は、何を入れる場所かで区別する</text><rect x="25" y="115" width="335" height="360" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="192.5" y="153.1" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="700" fill="#231F20">CPUが使うDDR3</text><text x="192.5" y="189.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="700" fill="#231F20">命令を保存</text><rect x="62" y="235" width="260" height="145" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="192.0" y="281.85" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">「色を指定」</text><text x="192.0" y="316.95000000000005" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">「三角形を描く」</text><text x="192.0" y="352.05000000000007" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">などの命令列</text><rect x="433" y="115" width="335" height="360" fill="#CCD9F1" stroke="#231F20" stroke-width="2"/><text x="600.5" y="153.1" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="700" fill="#231F20">FPGA内のBRAM</text><text x="600.5" y="189.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="700" fill="#231F20">描画途中の画素</text><rect x="470" y="235" width="260" height="145" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="600.0" y="281.85" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#23