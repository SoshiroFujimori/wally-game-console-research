</text><text x="599.5" y="207.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">が完了</text><text x="599.5" y="315.4" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="44" font-weight="700" fill="#1673C3">2</text><polyline points="707,182 727,182" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="727,182 715.0,187.0 715.0,177.0" fill="#231F20"/><rect x="728" y="120" width="215" height="122" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="835.5" y="173.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">Aの2件目</text><text x="835.5" y="207.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">が完了</text><text x="835.5" y="315.4" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="44" font-weight="700" fill="#1673C3">1</text><polyline points="943,182 963,182" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="963,182 951.0,187.0 951.0,177.0" fill="#231F20"/><rect x="964" y="120" width="215" height="122" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="1071.5" y="173.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">Bの最初の</text><text x="1071.5" y="207.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">読み出しが完了</text><text x="1071.5" y="315.4" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="44" font-weight="700" fill="#1673C3">0</text><text x="595.0" y="374.45" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">完了まで待つ返事の数</text><rect x="35" y="423" width="840" height="75" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="455.0" y="470.3" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">残りがあるため、Aの再利用を待つ</text><rect x="915" y="423" width="250" height="75" fill="#77A3DC" stroke="#231F20" stroke-width="2"/><text x="1040.0" y="470.3" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">完了を通知</text><text x="600.0" y="549.4" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="24" font-weight="400" fill="#231F20">この図は同時の要求・完了がない例。実回路は同じクロックでの完了も差し引く。</text></svg>