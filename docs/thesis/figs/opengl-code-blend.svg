<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540"><rect width="100%" height="100%" fill="white"/><text x="600.0" y="46.15" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="700" fill="#231F20">alphaを使って文字色と背景色の割合を決める</text><text x="595.0" y="122.3" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="700" fill="#231F20">保存するRGB = 文字のRGB × a + 背景のRGB × (1 − a)</text><rect x="30" y="190" width="235" height="115" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="147.5" y="239.4" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">文字の線</text><text x="147.5" y="274.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">a = 1</text><rect x="355" y="190" width="450" height="115" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="580.0" y="239.1" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">文字 × 1</text><text x="580.0" y="275.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">+ 背景 × 0</text><rect x="895" y="190" width="275" height="115" fill="#baffff" stroke="#231F20" stroke-width="2"/><text x="1032.5" y="256.95" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">文字色が残る</text><polyline points="265,248 355,248" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="355,248 343.0,253.0 343.0,243.0" fill="#231F20"/><polyline points="805,248 895,248" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="895,248 883.0,253.0 883.0,243.0" fill="#231F20"/><rect x="30" y="350" width="235" height="115" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="147.5" y="399.4" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">透明な点</text><text x="147.5" y="434.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">a = 0</text><rect x="355" y="350" width="450" height="115" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="580.0" y="399.1" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">文字 × 0</text><text x="580.0" y="435.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">+ 背景 × 1</text><rect x="895" y="350" width="275" height="115" fill="#ffdddd" stroke="#231F20" stroke-width="2"/><text x="1032.5" y="416.95" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">背景色が残る</text><polyline points="265,408 355,408" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="355,408 343.0,413.0 343.0,403.0" fill="#231F20"/><polyline points="805,408 895,408" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="895,408 883.0,413.0 883.0,403.0" fill="#231F20"/></svg>