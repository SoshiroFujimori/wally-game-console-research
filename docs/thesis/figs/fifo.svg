<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="835" viewBox="0 0 1200 835"><rect width="100%" height="100%" fill="white"/><text x="600.0" y="38.7" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="32" font-weight="700" fill="#231F20">説明用のFIFO  三語まで保存できる場合</text><text x="170.0" y="95.95" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="700" fill="#231F20">入口へ渡したい値</text><text x="590.0" y="91.45" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="700" fill="#231F20">FIFOの中身</text><text x="448.0" y="122.35" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="21" font-weight="400" fill="#231F20">入口側</text><polyline points="519,115 636,115" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="636,115 624.0,120.0 624.0,110.0" fill="#231F20"/><text x="706.0" y="122.35" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="21" font-weight="400" fill="#231F20">出口側</text><text x="1014.5" y="95.95" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="700" fill="#231F20">出口へ渡した値</text><text x="41.0" y="176.45" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="700" fill="#231F20">①</text><rect x="86" y="137" width="147" height="61" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="159.5" y="179.4" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="34" font-weight="700" fill="#231F20">7 → 8</text><polyline points="245,168 377,168" fill="none" stroke="#1673C3" stroke-width="2"/><polygon points="377,168 365.0,173.0 365.0,163.0" fill="#1673C3"/><rect x="390" y="137" width="116" height="61" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><rect x="519" y="137" width="116" height="61" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/>