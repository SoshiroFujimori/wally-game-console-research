ill="#231F20">9を受け取り三語が埋まる</text><text x="41.0" y="426.45" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="700" fill="#231F20">③</text><rect x="86" y="387" width="147" height="61" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="159.5" y="429.4" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="34" font-weight="700" fill="#231F20">10</text><text x="313.5" y="410.3" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="24" font-weight="400" fill="#1673C3">受取不可</text><text x="313.5" y="441.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="24" font-weight="400" fill="#1673C3">0を返す</text><rect x="390" y="387" width="116" height="61" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="448.0" y="429.4" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="34" font-weight="700" fill="#231F20">9</text><rect x="519" y="387" width="116" height="61" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="577.0" y="429.4" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="34" font-weight="700" fill="#231F20">8</text><rect x="648" y="387" width="116" height="61" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="706.0" y="429.4" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="34" font-weight="700" fill="#231F20">7</text><text x="365" y="485.25" text-anchor="start" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#1673C3">満杯なので10は待つ</text><text x="41.0" y="551.45" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="700" fill="#231F20">④</text><rect x="86" y="512" width="147" height="61" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="159.5" y="554.4" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="34" font-weight="700" fill="#231F20">10</text><text x="313.5" y="535.3" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="24" font-weight="400" fill="#1673C3">空きの通知</text><text x="313.5" y="566.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="24" font-weight="400" fill="#1673C3">を待つ</text><rect x="390" y="512" width="116" height="61" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><rect x="519" y="512" width="116" height="61" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="577.0" y="554.4" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="34" font-weight="700" fill="#231F20">9</text><rect x="648" y="512" width="116" height="61" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="706.0" y="554.4" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="34" font-weight="700" fill="#231F20">8</text><polyline points="777,543 931,543" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="931,543 919.0,548.0 919.0,538.0" fill="#231F20"/><rect x="942" y="512" width="140" height="61" fill="#CCD9F1" stroke="#231F20" stroke-width="2"/><text x="1012.0" y="554.4" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="34" font-weight="700" fill="#231F20">7</text><text x="365" y="610.25" text-anchor="start" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">右端の7を取り出すと空きができる</text><text x="41.0" y="676.45" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="700" fill="#231F20">⑤</text><rect x="86" y="637" width="147" height="61" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="159.5" y="679.4" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="34" font-weight="700" fill="#231F20">10</text><polyline points="245,668 377,668" fill="none" stroke=