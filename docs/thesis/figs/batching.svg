<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570"><rect width="100%" height="100%" fill="white"/><text x="600.0" y="45.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="32" font-weight="700" fill="#231F20">同じ三個の四角形を描く説明用の例</text><text x="107.5" y="133.1" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">個別に指定</text><text x="107.5" y="169.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">3回のまとまり</text><rect x="235" y="100" width="280" height="180" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="375.0" y="162.45" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">begin</text><text x="375.0" y="200.14999999999998" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">四角形1の4頂点</text><text x="375.0" y="237.84999999999997" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">end</text><rect x="555" y="100" width="280" height="180" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="695.0" y="162.45" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">begin</text><text x="695.0" y="200.14999999999998" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">四角形2の4頂点</text><text x="695.0" y="237.84999999999997" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">end</text><rect x="875" y="100" width="280" height="180" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="1015.0" y="162.45" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">begin</text><text x="1015.0" y="200.14999999999998" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">四角形3の4頂点</text><text x="1015.0" y="237.84999999999997" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">end</text><text x="107.5" y="392.1" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">まとめて指定</text><text x="107.5" y="428.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">1回のまとまり</text><rect x="235" y="340" width="920" height="128" fill="#CCD9F1" stroke="#231F20" stroke-width="2"/><text x="695.0" y="414.15" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">begin → 四角形1 → 四角形2 → 四角形3 → end</text><text x="600.0" y="528.95" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">図形は3個のまま。図形の指定を始めて終える回数を減らす。頂点を渡す仕事は残る。</text></svg>