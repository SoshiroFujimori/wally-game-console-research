<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470"><rect width="100%" height="100%" fill="white"/><text x="600.0" y="43.349999999999994" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="31" font-weight="700" fill="#231F20">説明用：2 bitの値を 01 から 10 へ変える</text><text x="132.5" y="115.8" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">送る側の</text><text x="132.5" y="153.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">意図した値</text><rect x="290" y="90" width="270" height="65" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="425.0" y="134.05" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="33" font-weight="400" fill="#231F20">01</text><rect x="810" y="90" width="270" height="65" fill="#CCD9F1" stroke="#231F20" stroke-width="2"/><text x="945.0" y="134.05" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="33" font-weight="400" fill="#231F20">10</text><polyline points="560,122 810,122" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="810,122 798.0,127.0 798.0,117.0" fill="#231F20"/><text x="695.0" y="243.65" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">二本の線が全く同時に相手へ届くとは限らない</text><rect x="460" y="294" width="510" height="82" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="715.0" y="345.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="400" fill="#231F20">途中で00を読んでしまう例</text><polyline points="560,155 560,190" fill="none" stroke="#231F20" stroke-width="2"/><polyline points="560,264 560,294" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="560,294 555.0,282.0 565.0,282.0" fill="#231F20"/><text x="600.0" y="443.95" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">複数bitを一組として渡す仕組みが必要。各bitへ別々に同期回路を置くだけでは足りない。</text></svg>