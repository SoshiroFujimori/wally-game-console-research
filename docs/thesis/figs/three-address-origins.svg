<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><rect width="100%" height="100%" fill="white"/><text x="600.0" y="44.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="32" font-weight="700" fill="#231F20">同じ画像 A でも、どこから数えるかで値が変わる</text><text x="600.0" y="101.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="32" font-weight="700" fill="#231F20">画像 A の物理アドレスは 0x9fe00000</text><rect x="25" y="157" width="345" height="123" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="197.5" y="209.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="31" font-weight="400" fill="#231F20">CPU が使う番地</text><text x="197.5" y="249.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="31" font-weight="400" fill="#231F20">0x9fe00000</text><rect x="430" y="157" width="345" height="123" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="602.5" y="209.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="31" font-weight="400" fill="#231F20">DDR3 の先頭</text><text x="602.5" y="249.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="31" font-weight="400" fill="#231F20">0x80000000</text><rect x="835" y="157" width="340" height="123" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="1005.0" y="209.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="400" fill="#231F20">描画用予約の先頭</text><text x="1005.0" y="248.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="400" fill="#231F20">0x9e000000</text><text x="600.0" y="356.15" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="700" fill="#231F20">先頭との差をとると、同じ場所を別の数で表せる</text><rect x="35" y="413" width="535" height="134" fill="#CCD9F1" stroke="#231F20" stroke-width="2"/><text x="302.5" y="453.4" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">DDR3 の先頭からの距離</text><text x="302.5" y="489.79999999999995" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">0x9fe00000 − 0x80000000</text><text x="302.5" y="526.1999999999999" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">= 0x1fe00000</text><rect x="635" y="413" width="535" height="134" fill="#CCD9F1" stroke="#231F20" stroke-width="2"/><text x="902.5" y="453.4" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">描画用予約の先頭からの距離</text><text x="902.5" y="489.79999999999995" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">0x9fe00000 − 0x9e000000</text><text x="902.5" y="526.1999999999999" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">= 0x01e00000</text><text x="600.0" y="617.65" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="700" fill="#231F20">オフセットを渡すときは、「何を 0 とした値か」まで確認する。</text></svg>