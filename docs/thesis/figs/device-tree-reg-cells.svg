<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><rect width="100%" height="100%" fill="white"/><text x="600.0" y="44.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="32" font-weight="700" fill="#231F20">reg の四つの値から、予約の先頭と容量を読む</text><text x="600.0" y="110.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="32" font-weight="700" fill="#231F20">reg = &lt;0  0x9e000000  0  0x02000000&gt;;</text><text x="295.0" y="186.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="700" fill="#231F20">先頭の物理アドレス</text><rect x="30" y="230" width="155" height="84" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="107.5" y="283.9" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="34" font-weight="400" fill="#231F20">0</text><rect x="185" y="230" width="375" height="84" fill="#CCD9F1" stroke="#231F20" stroke-width="2"/><text x="372.5" y="283.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="32" font-weight="400" fill="#231F20">0x9e000000</text><text x="107.5" y="356.1" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">上位 32 bit</text><text x="372.5" y="356.1" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">下位 32 bit</text><text x="905.0" y="186.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="700" fill="#231F20">予約する容量</text><rect x="640" y="230" width="155" height="84" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="717.5" y="283.9" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="34" font-weight="400" fill="#231F20">0</text><rect x="795" y="230" width="375" height="84" fill="#CCD9F1" stroke="#231F20" stroke-width="2"/><text x="982.5" y="283.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="32" font-weight="400" fill="#231F20">0x02000000</text><text x="717.5" y="356.1" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">上位 32 bit</text><text x="982.5" y="356.1" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">下位 32 bit</text><text x="295.0" y="438.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="400" fill="#231F20">合わせて 64 bit の番地</text><text x="295.0" y="477.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="400" fill="#231F20">0x000000009e000000</text><text x="905.0" y="439.1" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">合わせて 64 bit の大きさ</text><text x="905.0" y="475.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">33,554,432 byte = 32 MiB</text><text x="600.0" y="562.95" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">この予約は Linux の割当てを制限する。FPGA 内の保護回路を作る設定ではない。</text></svg>