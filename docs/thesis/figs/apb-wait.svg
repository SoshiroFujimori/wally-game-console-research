,180" fill="none" stroke="#1673C3" stroke-width="2"/><text x="270" y="249.95" text-anchor="end" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">PENABLE</text><polyline points="310,258 460,258 460,258 460,218 610,218 610,218 610,218 760,218 760,218 760,218 910,218 910,218 910,258 1060,258" fill="none" stroke="#1673C3" stroke-width="2"/><text x="270" y="327.95" text-anchor="end" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">PREADY</text><polyline points="310,336 460,336 460,336 460,336 610,336 610,336 610,336 760,336 760,336 760,296 910,296 910,296 910,336 1060,336" fill="none" stroke="#231F20" stroke-width="2"/><text x="270" y="409.6" text-anchor="end" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">書き込みデータ</text><rect x="310" y="376" width="600" height="52" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="610.0" y="411.1" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">同じ32 bitの命令を保持</text><polyline points="910,115 910,460" fill="none" stroke="#231F20" stroke-width="2"/><text x="905.0" y="502.1" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="700" fill="#1673C3">この境界で一度だけ受け取る</text><text x="600.0" y="547.25" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">青＝要求側の信号、黒＝受け取り側のPREADY。PWRITE = 1の例。</text></svg>