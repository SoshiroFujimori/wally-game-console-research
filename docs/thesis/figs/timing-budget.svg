<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480"><rect width="100%" height="100%" fill="white"/><text x="600.0" y="48.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="700" fill="#231F20">説明用の時間：最大遅延48 ns、受け側の準備時間1 ns</text><text x="195.0" y="135.15" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="700" fill="#231F20">20 MHz：周期50 ns</text><polyline points="390,160 1160,160" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="1160,160 1148.0,165.0 1148.0,155.0" fill="#231F20"/><rect x="390" y="136" width="672" height="48" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="726.0" y="169.8" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">信号が届くまで 48 ns</text><rect x="1062" y="136" width="14" height="48" fill="#77A3DC" stroke="#231F20" stroke-width="2"/><polyline points="1090,105 1090,223" fill="none" stroke="#1673C3" stroke-width="2"/><text x="1090.0" y="257.3" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#1673C3">50 ns</text><text x="194.0" y="208.95" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">50 − 48 − 1 = +1 ns</text><text x="195.0" y="312.15" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="700" fill="#231F20">25 MHz：周期40 ns</text><polyline points="390,337 1160,337" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="1160,337 1148.0,342.0 1148.0,332.0" fill="#231F20"/><rect x="390" y="313" width="672" height="48" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="726.0" y="346.8" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">信号が届くまで 48 ns</text><rect x="1062" y="313" width="14" height="48" fill="#77A3DC" stroke="#231F20" stroke-width="2"/><polyline points="950,282 950,400" fill="none" stroke="#1673C3" stroke-width="2"/><text x="950.0" y="434.3" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#1673C3">40 ns</text><text x="194.0" y="385.95" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">40 − 48 − 1 = −9 ns</text><text x="900.0" y="255.1" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">濃い青：準備時間1 ns</text></svg>