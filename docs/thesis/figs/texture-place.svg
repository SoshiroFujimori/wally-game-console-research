<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="525" viewBox="0 0 1200 525"><rect width="100%" height="100%" fill="white"/><text x="262.5" y="48.349999999999994" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="31" font-weight="700" fill="#231F20">模様の中の、どこを読むか</text><rect x="40" y="95" width="440" height="230" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><polyline points="95,95 95,325" fill="none" stroke="#231F20" stroke-width="2"/><polyline points="150,95 150,325" fill="none" stroke="#231F20" stroke-width="2"/><polyline points="205,95 205,325" fill="none" stroke="#231F20" stroke-width="2"/><polyline points="260,95 260,325" fill="none" stroke="#231F20" stroke-width="2"/><polyline points="315,95 315,325" fill="none" stroke="#231F20" stroke-width="2"/><polyline points="370,95 370,325" fill="none" stroke="#231F20" stroke-width="2"/><polyline points="425,95 425,325" fill="none" stroke="#231F20" stroke-width="2"/><polyline points="40,152.5 480,152.5" fill="none" stroke="#231F20" stroke-width="2"/><polyline points="40,210.0 480,210.0" fill="none" stroke="#231F20" stroke-width="2"/><polyline points="40,267.5 480,267.5" fill="none" stroke="#231F20" stroke-width="2"/><rect x="95" y="95" width="55" height="57.5" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="122.5" y="134.95" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="32" font-weight="400" fill="#231F20">0</text><text x="267.5" y="367.35" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">64 × 32画素の文字画像</text><text x="267.5" y="402.45000000000005" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">8 × 8画素の枠を選ぶ</text><text x="267.5" y="437.55000000000007" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">u = 0.125〜0.25、v = 0〜0.25</text><text x="935.0" y="48.349999999999994" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="31" font-weight="700" fill="#231F20">画面の、どこへ置くか</text><rect x="710" y="95" width="445" height="230" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><rect x="840" y="155" width="100" height="100" fill="#CCD9F1" stroke="#231F20" stroke-width="2"/><text x="890.0" y="227.75" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="65" font-weight="400" fill="#231F20">0</text><text x="940.0" y="367.35" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">四角形の頂点で位置を指定</text><text x="940.0" y="402.45000000000005" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">枠の一辺は8 × scale</text><text x="940.0" y="437.55000000000007" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">同じ模様を別の位置にも置ける</text><polyline points="480,195 710,195" fill="none" stroke="#1673C3" stroke-width="2"/><polygon points="710,195 698.0,200.0 698.0,190.0" fill="#1673C3"/><text x="596.5" y="130.1" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#1673C3">模様を</text><text x="596.5" y="166.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#1673C3">対応させる</text><text x="600.0" y="498.95" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">青は説明上の領域の区別。実際の文字画像の色や透明度を表すものではない。</text></svg>