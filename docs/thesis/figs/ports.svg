<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460"><rect width="100%" height="100%" fill="white"/><text x="600.0" y="50.349999999999994" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="31" font-weight="700" fill="#231F20">Adderという種類の部品を、calcという名前で置く</text><rect x="445" y="95" width="340" height="230" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="615.0" y="143.4" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="32" font-weight="700" fill="#231F20">Adder</text><text x="615.0" y="185.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="32" font-weight="700" fill="#231F20">calc</text><text x="485.0" y="230.85" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="31" font-weight="400" fill="#231F20">A</text><text x="485.0" y="300.85" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="31" font-weight="400" fill="#231F20">B</text><text x="732.5" y="260.15" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">Sum</text><polyline points="100,220 445,220" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="445,220 433.0,225.0 433.0,215.0" fill="#231F20"/><text x="252.5" y="196.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="400" fill="#231F20">leftという信号</text><polyline points="100,290 445,290" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="445,290 433.0,295.0 433.0,285.0" fill="#231F20"/><text x="252.5" y="329.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="400" fill="#231F20">rightという信号</text><polyline points="785,250 1120,250" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="1120,250 1108.0,255.0 1108.0,245.0" fill="#231F20"/><text x="979.5" y="224.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="400" fill="#231F20">totalという信号</text><rect x="125" y="375" width="950" height="58" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="600.0" y="414.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="400" fill="#231F20">Adder calc(.A(left), .B(right), .Sum(total));</text></svg>