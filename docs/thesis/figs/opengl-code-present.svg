<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="100%" height="100%" fill="white"/><text x="600.0" y="46.15" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="700" fill="#231F20">図形の指定から回路への送信と表示先切替えへ</text><rect x="25" y="105" width="460" height="82" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="255.0" y="154.75" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">renderer.draw(...)</text><rect x="590" y="105" width="580" height="82" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="880.0" y="138.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">図形と文字を指定</text><text x="880.0" y="171.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">ライブラリが命令を準備</text><polyline points="485,146 590,146" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="590,146 578.0,151.0 578.0,141.0" fill="#231F20"/><polyline points="255,187 255,217" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="255,217 250.0,205.0 260.0,205.0" fill="#231F20"/><rect x="25" y="217" width="460" height="82" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="255.0" y="266.75" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">bus.frameCount()</text><rect x="590" y="217" width="580" height="82" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="880.0" y="266.75" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">現在の表示先切替え回数を読む</text><polyline points="485,258 590,258" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="590,258 578.0,263.0 578.0,253.0" fill="#231F20"/><polyline points="255,299 255,329" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="255,329 250.0,317.0 260.0,317.0" fill="#231F20"/><rect x="25" y="329" width="460" height="82" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="255.0" y="378.75" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">gl.swapDisplayList()</text><rect x="590" y="329" width="580" height="82" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="880.0" y="362.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">命令の提出を進める</text><text x="880.0" y="395.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">保存と表示先切替えを依頼</text><polyline points="485,370 590,370" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="590,370 578.0,375.0 578.0,365.0" fill="#231F20"/><polyline points="255,411 255,441" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="255,441 250.0,429.0 260.0,429.0" fill="#231F20"/><rect x="25" y="441" width="460" height="82" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="255.0" y="490.75" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">bus.waitForFrame(previous)</text><rect x="590" y="441" width="580" height="82" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="880.0" y="490.75" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">回数が変わるまで確認する</text><polyline points="485,482 590,482" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="590,482 578.0,487.0 578.0,477.0" fill="#231F20"/><text x="595.0" y="601.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="700" fill="#1673C3">回路側：命令を受信 → 画素を計算・保存 → 表示する画像を切替え</text></svg>