<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="100%" height="100%" fill="white"/><text x="600.0" y="44.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="32" font-weight="700" fill="#231F20">二枚の画像は、DDR3 の末尾に予約した領域の一部に置く</text><text x="265.0" y="99.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="700" fill="#231F20">DDR3 全体 512 MiB</text><text x="867.5" y="99.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="700" fill="#231F20">末尾 32 MiB を拡大して見る</text><rect x="190" y="168" width="300" height="230" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="340.0" y="274.3" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">Linux 等が使う</text><text x="340.0" y="312.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">480 MiB</text><rect x="190" y="398" width="300" height="119" fill="#CCD9F1" stroke="#231F20" stroke-width="2"/><text x="340.0" y="448.8" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">描画用の予約</text><text x="340.0" y="486.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">32 MiB</text><text x="95.0" y="154.25" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">0x80000000</text><text x="95.0" y="400.75" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">0x9e000000</text><text x="95.0" y="530.75" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">0xa0000000</text><polyline points="490,398 605,167" fill="none" stroke="#231F20" stroke-width="2" stroke-dasharray="10 7"/><polyline points="490,517 605,517" fill="none" stroke="#231F20" stroke-width="2" stroke-dasharray="10 7"/><rect x="605" y="168" width="550" height="349" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="880.0" y="216.9" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">テクスチャ等に使う領域・空き</text><text x="880.0" y="252.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">（図は容量の比率を表さない）</text><rect x="625" y="289" width="510" height="90" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="880.0" y="325.9" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">画像 B　0x9fc00000</text><text x="880.0" y="361.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">640 × 480 × 2 = 614,400 byte</text><rect x="625" y="409" width="510" height="90" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="880.0" y="445.9" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">画像 A　0x9fe00000</text><text x="880.0" y="481.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">640 × 480 × 2 = 614,400 byte</text><text x="600.0" y="604.95" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">0xa0000000 は DDR3 の直後の境界。予約 32 MiB 全体が二枚の画像ではない。</text></svg>