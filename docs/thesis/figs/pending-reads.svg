<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450"><rect width="100%" height="100%" fill="white"/><rect x="40" y="60" width="248" height="140" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="164.0" y="121.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">古い要求が2個</text><text x="164.0" y="158.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">未完了</text><polyline points="288,130 332,130" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="332,130 320.0,135.0 320.0,125.0" fill="#231F20"/><rect x="332" y="60" width="248" height="140" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="456.0" y="121.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">新しい先頭の</text><text x="456.0" y="158.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">要求を受理</text><polyline points="580,130 624,130" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="624,130 612.0,135.0 612.0,125.0" fill="#231F20"/><rect x="624" y="60" width="248" height="140" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="748.0" y="121.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">3個の最後の</text><text x="748.0" y="158.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">データが返る</text><polyline points="872,130 916,130" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="916,130 904.0,135.0 904.0,125.0" fill="#231F20"/><rect x="916" y="60" width="248" height="140" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="1040.0" y="121.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">Ack = 1</text><text x="1040.0" y="158.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">再利用を許可</text><text x="600.0" y="281.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="32" font-weight="400" fill="#231F20">Remaining = 2 + 1 = 3</text><text x="600.0" y="381.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">同じ周期に1個完了していれば Remaining = 2 + 1 − 1 = 2</text></svg>