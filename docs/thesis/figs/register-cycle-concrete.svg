<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="100%" height="100%" fill="white"/><text x="600.0" y="40.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="32" font-weight="700" fill="#231F20">レジスタの値を一回ずつ増やす回路</text><rect x="89" y="119" width="300" height="117" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="239.0" y="168.8" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="700" fill="#231F20">レジスタ</text><text x="239.0" y="206.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="700" fill="#231F20">現在の値を覚える</text><rect x="798" y="119" width="300" height="117" fill="#CCD9F1" stroke="#231F20" stroke-width="2"/><text x="948.0" y="168.8" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="700" fill="#231F20">足し算の回路</text><text x="948.0" y="206.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="700" fill="#231F20">現在の値 + 1</text><polyline points="389,172 798,172" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="798,172 786.0,177.0 786.0,167.0" fill="#231F20"/><text x="594.0" y="146.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="400" fill="#231F20">現在の値 3</text><polyline points="948,236 948,304 239,304 239,236" fill="none" stroke="#1673C3" stroke-width="2"/><polygon points="239,236 244.0,248.0 234.0,248.0" fill="#1673C3"/><text x="583.0" y="291.65" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#1673C3">次に保存する値 4</text><polyline points="25,207 89,207" fill="none" stroke="#1673C3" stroke-width="2"/><polygon points="89,207 77.0,212.0 77.0,202.0" fill="#1673C3"/><text x="117.5" y="281.9" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sa