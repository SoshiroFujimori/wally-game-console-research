<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480"><rect width="100%" height="100%" fill="white"/><text x="600.0" y="46.15" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="700" fill="#231F20">四隅で指定した面の内側に画素を作る</text><text x="200.0" y="123.75" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="700" fill="#231F20">四頂点で面を指定</text><rect x="55" y="175" width="290" height="140" fill="#ff0000" stroke="#231F20" stroke-width="2"/><text x="600.0" y="123.75" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="700" fill="#231F20">三角形へ組み立てる</text><rect x="455" y="175" width="290" height="140" fill="#ff0000" stroke="#231F20" stroke-width="2"/><text x="1000.0" y="123.75" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="700" fill="#231F20">内側の画素に色を保存</text><rect x="855" y="175" width="290" height="140" fill="#ff0000" stroke="#231F20" stroke-width="2"/><ellipse cx="55.0" cy="175.0" rx="6.0" ry="6.0" fill="#231F20" stroke="#231F20" stroke-width="2"/><ellipse cx="55.0" cy="315.0" rx="6.0" ry="6.0" fill="#231F20" stroke="#231F20" stroke-width="2"/><ellipse cx="345.0" cy="175.0" rx="6.0" ry="6.0" fill="#231F20" stroke="#231F20" stroke-width="2"/><ellipse cx="345.0" cy="315.0" rx="6.0" ry="6.0" fill="#231F20" stroke="#231F20" stroke-width="2"/><polyline points="455,175 745,315" fill="none" stroke="#231F20" stroke-width="2"/><polyline points="884,175 884,315" fill="none" stroke="#772222" stroke-width="2"/><polyline points="913,175 913,315" fill="none" stroke="#772222" stroke-width="2"/><polyline points="942,175 942,315" fill="none" stroke="#772222" stroke-width="2"/><polyline points="971,175 971,315" fill="none" stroke="#772222" stroke-width="2"/><polyline points="1000,175 1000,315" fill="none" stroke="#772222" stroke-width="2"/><polyline points="1029,175 1029,315" fill="none" stroke="#772222" stroke-width="2"/><polyline points="1058,175 1058,315" fill="none" stroke="#772222" stroke-width="2"/><polyline points="1087,175 1087,315" fill="none" stroke="#772222" stroke-width="2"/><polyline points="1116,175 1116,315" fill="none" stroke="#772222" stroke-width="2"/><polyline points="855,203 1145,203" fill="none" stroke="#772222" stroke-width="2"/><polyline points="855,231 1145,231" fill="none" stroke="#772222" stroke-width="2"/><polyline points="855,259 1145,259" fill="none" stroke="#772222" stroke-width="2"/><polyline points="855,287 1145,287" fill="none" stroke="#772222" stroke-width="2"/><polyline points="365,245 435,245" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="435,245 423.0,250.0 423.0,240.0" fill="#231F20"/><polyline points="765,245 835,245" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="835,245 823.0,250.0 823.0,240.0" fill="#231F20"/><text x="600.0" y="394.7" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">対角線や格子は説明用。画面に線を描く指示ではない。</text><text x="600.0" y="428.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">頂点の位置・色から、図形内の画素位置と色を求める。</text></svg>