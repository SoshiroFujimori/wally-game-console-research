<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410"><rect width="100%" height="100%" fill="white"/><text x="600.0" y="44.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="32" font-weight="700" fill="#231F20">同じ値 4 を、十六進数と 8 個の bit で表す</text><text x="120.0" y="118.3" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="38" font-weight="700" fill="#231F20">0x04</text><polyline points="228,105 303,105" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="303,105 291.0,110.0 291.0,100.0" fill="#231F20"/><text x="367.5" y="88.45" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">bit 7</text><rect x="325" y="104" width="85" height="80" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="367.5" y="156.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="36" font-weight="700" fill="#231F20">0</text><text x="462.5" y="88.45" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">bit 6</text><rect x="420" y="104" width="85" height="80" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="462.5" y="156.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="36" font-weight="700" fill="#231F20">0</text><text x="557.5" y="88.45" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">bit 5</text><rect x="515" y="104" width="85" height="80" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="557.5" y="156.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="36" font-weight="700" fill="#231F20">0</text><text x="652.5" y="88.45" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">bit 4</text><rect x="610" y="104" width="85" height="80" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="652.5" y="156.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="36" font-weight="700" fill="#231F20">0</text><text x="747.5" y="88.45" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">bit 3</text><rect x="705" y="104" width="85" height="80" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="747.5" y="156.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="36" font-weight="700" fill="#231F20">0</text><text x="842.5" y="88.45" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">bit 2</text><rect x="800" y="104" width="85" height="80" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="842.5" y="156.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="36" font-weight="700" fill="#231F20">1</text><text x="937.5" y="88.45" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">bit 1</text><rect x="895" y="104" width="85" height="80" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="937.5" y="156.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="36" font-weight="700" fill="#231F20">0</text><text x="1032.5" y="88.45" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">bit 0</text><rect x="990" y="104" width="85" height="80" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="1032.5" y="156.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="36" font-weight="700" fill="#231F20">0</text><polyline points="325,202 325,215 1085,215 1085,202" fill="none" stroke="#231F20" stroke-width="2"/><text x="705.0" y="254.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="400" fill="#231F20">この 8 bit 全体で 1 byte</text><text x="600.0" y="323.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">1 が立つのは bit 2 → その桁の重みは 2² = 4</text><text x="600.0" y="360.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">右端を bit 0 と数える。左から 2 番目という意味ではない。</text></svg>