<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="545" viewBox="0 0 1200 545"><rect width="100%" height="100%" fill="white"/><text x="600.0" y="40.849999999999994" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="31" font-weight="700" fill="#231F20">座標 (10, 20) の画素を、メモリの番地へ対応付ける</text><rect x="50" y="115" width="450" height="320" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><polyline points="50,179 500,179" fill="none" stroke="#231F20" stroke-width="2"/><polyline points="50,243 500,243" fill="none" stroke="#231F20" stroke-width="2"/><polyline points="50,307 500,307" fill="none" stroke="#231F20" stroke-width="2"/><polyline points="50,371 500,371" fill="none" stroke="#231F20" stroke-width="2"/><text x="275.0" y="105.45" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">横640画素</text><rect x="50" y="307" width="450" height="64" fill="#CCD9F1" stroke="#231F20" stroke-width="2"/><text x="275.0" y="348.45" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">20行目まで進む</text><rect x="78" y="307" width="20" height="64" fill="#77A3DC" stroke="#231F20" stroke-width="2"/><polyline points="88,371 88,460 490,460" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="490,460 478.0,465.0 478.0,455.0" fill="#231F20"/><text x="287.5" y="425.75" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">その行の左から10画素進む</text><rect x="590" y="126" width="565" height="285" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="872.5" y="205.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">前にある画素</text><text x="872.5" y="241.9" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">640 × 20 ＋ 10 ＝ 12,810</text><text x="872.5" y="278.3" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20"></text><text x="872.5" y="314.7" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">byte数への換算</text><text x="872.5" y="351.09999999999997" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">12,810 × 2 ＝ 25,620 ＝ 0x6414</text><polyline points="500,340 590,340" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="590,340 578.0,345.0 578.0,335.0" fill="#231F20"/><text x="855.0" y="462.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="700" fill="#231F20">先頭 0x9fe00000 ＋ 0x6414</text><text x="855.0" y="499.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="700" fill="#231F20">＝ 0x9fe06414</text><text x="600.0" y="534.05" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="23" font-weight="400" fill="#231F20">左図は行を省略した模式図。画素の配置順と番地の計算を示す。</text></svg>