<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><rect width="100%" height="100%" fill="white"/><text x="600.0" y="44.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="32" font-weight="700" fill="#231F20">比較の組合せ、実行一回、保存画像一枚を分けて数える</text><rect x="25" y="89" width="1150" height="85" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="600.0" y="142.35" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="31" font-weight="400" fill="#231F20">3 種類の場面 × 3 種類の描き方 × 各 3 回の実行 = 27 回</text><text x="590.0" y="238.15" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="700" fill="#231F20">そのうちの一回を拡大する</text><rect x="30" y="292" width="290" height="118" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="175.0" y="324.4" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">最初の 30 フレーム</text><text x="175.0" y="360.79999999999995" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">準備運転</text><text x="175.0" y="397.19999999999993" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">集計から外す</text><rect x="320" y="292" width="550" height="118" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="595.0" y="342.3" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">続く 180 フレーム</text><text x="595.0" y="380.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">処理時間やゲーム状態を記録する</text><polyline points="870,351 962,351" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="962,351 950.0,356.0 950.0,346.0" fill="#231F20"/><rect x="962" y="292" width="213" height="118" fill="#CCD9F1" stroke="#231F20" stroke-width="2"/><text x="1068.5" y="342.9" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">最後の画像</text><text x="1068.5" y="378.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">一枚を保存</text><text x="600.0" y="479.7" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">状態の記録：27 回 × 180 フレーム = 4,860 フレーム分</text><text x="600.0" y="516.1" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">全画素の比較：27 回 × 最後の一枚 = 27 枚</text><text x="600.0" y="552.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">4,860 フレーム全部の画像を保存して比較した、という意味ではない。</text><text x="600.0" y="588.9" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">これらは E4 の実験で用いた数え方である。</text></svg>