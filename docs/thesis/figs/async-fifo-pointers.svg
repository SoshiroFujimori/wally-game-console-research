.0,390.0 192.0,400.0" fill="#1673C3"/><text x="605.0" y="430.25" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">読んだ進み具合も入口へ返す</text><text x="600.0" y="512.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">一般的な管理の模式図。AMD IPの内部配線を再現した図ではない。</text><text x="600.0" y="546.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">通知が届くまで、出口は空、入口は満杯と認識し続ける場合がある。</text></svg>