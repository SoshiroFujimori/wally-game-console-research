0" fill="none" stroke="#1673C3" stroke-width="2"/><polygon points="817,260 822.0,272.0 812.0,272.0" fill="#1673C3"/><text x="817.0" y="374.8" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">4</text><polyline points="951,335 951,260" fill="none" stroke="#1673C3" stroke-width="2"/><polygon points="951,260 956.0,272.0 946.0,272.0" fill="#1673C3"/><text x="951.0" y="374.8" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">5</text><text x="600.0" y="434.4" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">許可が1の間に複数の立ち上がりが来る。</text><text x="600.0" y="469.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">各回で同じ語を書かないよう、一回の受け渡しを管理する必要がある。</text></svg>