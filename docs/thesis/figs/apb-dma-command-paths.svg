<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710"><rect width="100%" height="100%" fill="white"/><text x="600.0" y="53.7" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="32" font-weight="700" fill="#231F20">同じ命令列を、誰がどこへ運ぶか</text><text x="30" y="120.15" text-anchor="start" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="700" fill="#231F20">APB送信：CPUが各語を読み、命令口へ書く</text><rect x="35" y="155" width="230" height="105" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="150.0" y="199.7" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">CPU用メモリ</text><text x="150.0" y="233.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">命令列</text><rect x="335" y="155" width="230" height="105" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="450.0" y="199.7" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">CPUの</text><text x="450.0" y="233.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">一語ずつの書込み</text><rect x="635" y="155" width="230" height="105" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="750.0" y="199.7" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">APB命令口</text><text x="750.0" y="233.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">命令FIFO</text><rect x="935" y="155" width="230" height="105" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="1050.0" y="199.7" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">RasterIXの</text><text x="1050.0" y="233.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">命令解析回路</text><polyline points="272,207 328,207" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="328,207 316.0,212.0 316.0,202.0" fill="#231F20"/><polyline points="572,207 628,207" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="628,207 616.0,212.0 616.0,202.0" fill="#231F20"/><polyline points="872,207 928,207" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="928,207 916.0,212.0 916.0,202.0" fill="#231F20"/><text x="30" y="352.15" text-anchor="start" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="700" fill="#231F20">DMA送信：CPUがコピーと開始操作をし、回路が読む</text><rect x="35" y="390" width="230" height="115" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="150.0" y="439.7" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">CPU用メモリ</text><text x="150.0" y="473.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">命令列</text><rect x="335" y="390" width="230" height="115" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="450.0" y="439.7" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">予約したDDR3</text><text x="450.0" y="473.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">コピーした命令列</text><rect x="635" y="390" width="230" height="115" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="750.0" y="439.7" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">RasterIXの</text><text x="750.0" y="473.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">命令DMA</text><rect x="935" y="390" width="230" height="115" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="1050.0" y="439.7" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">RasterIXの</text><text x="1050.0" y="473.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">命令解析回路</text><polyline points="272,448 328,448" fill="none" stroke="#1673C3" stroke-width="2"/><polygon points="328,448 316.0,453.0 316.0,443.0" fill="#1673C3"/><polyline points="572,448 628,448" fill="none" stroke="#1673C3" stroke-width="2"/><polygon points="628,448 616.0,453.0 616.0,443.0" fill="#1673C3"/><polyline points="872,448 928,448" fill="none" stroke="#1673C3" stroke-width="2"/><polygon points="928,448 916.0,453.0 916.0,443.0" fill="#1673C3"/><text x="325.0" y="548.75" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#1673C3">CPUがコピー</text><text x="640.0" y="548.75" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#1673C3">DMAがDDR3を読む</text><text x="600.0" y="621.9" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">DMAの場所と開始もCPUから指示する。完了前に予約領域を上書きしない。</text><text x="600.0" y="657.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">比較時間には、コピー・開始操作・完了待ちも含める。</text></svg>