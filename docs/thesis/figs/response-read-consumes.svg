<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><rect width="100%" height="100%" fill="white"/><text x="600.0" y="43.7" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="32" font-weight="700" fill="#231F20">RESP の読出しは、値を見ると同時に先頭の応答を取り出す</text><text x="140.0" y="106.8" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">応答 FIFO の中身</text><text x="285.0" y="142.05" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="23" font-weight="400" fill="#231F20">入口側</text><polyline points="342,134 427,134" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="427,134 415.0,139.0 415.0,129.0" fill="#231F20"/><text x="485.0" y="142.05" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="23" font-weight="400" fill="#231F20">出口側</text><text x="115.0" y="198.95" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">読出し前</text><rect x="235" y="157" width="100" height="65" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="285.0" y="200.35" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="31" font-weight="400" fill="#231F20">C</text><rect x="335" y="157" width="100" height="65" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="385.0" y="200.35" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="31" font-weight="400" fill="#231F20">B</text><rect x="435" y="157" width="100" height="65" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="485.0" y="200.35" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="31" font-weight="400" fill="#231F20">A</text><text x="550" y="198.95" text-anchor="start" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">先頭は A。次に受け取れる値は A。</text><text x="115.0" y="318.95" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">1 回読出し後</text><rect x="235" y="277" width="100" height="65" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="285.0" y="320.35" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="31" font-weight="400" fill="#231F20">空</text><rect x="335" y="277" width="100" height="65" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="385.0" y="320.35" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="31" font-weight="400" fill="#231F20">C</text><rect x="435" y="277" width="100" height="65" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="485.0" y="320.35" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="31" font-weight="400" fill="#231F20">B</text><text x="550" y="318.95" text-anchor="start" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">CPU が A を受け取る。先頭は B に変わる。</text><text x="115.0" y="438.95" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">2 回読出し後</text><rect x="235" y="397" width="100" height="65" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="285.0" y="440.35" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="31" font-weight="400" fill="#231F20">空</text><rect x="335" y="397" width="100" height="65" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="385.0" y="440.35" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="31" font-weight="400" fill="#231F20">空</text><rect x="435" y="397" width="100" height="65" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="485.0" y="440.35" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="31" font-weight="400" fill="#231F20">C</text><text x="550" y="438.95" text-anchor="start" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">CPU が B を受け取る。先頭は C に変わる。</text><text x="600.0" y="502.75" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">箱は待ち順を表し、右端が次に取り出す語である。</text><text x="600.0" y="549.8" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="700" fill="#231F20">STATUS は応答の有無を調べる入口。読むだけでは応答を取り出さない。</text></svg>