<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="100%" height="100%" fill="white"/><text x="600.0" y="44.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="32" font-weight="700" fill="#231F20">クロックを作る回路と、時間を伝える制約は役割が違う</text><text x="120.0" y="96.8" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="700" fill="#231F20">実機で動く回路</text><rect x="25" y="125" width="260" height="100" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="155.0" y="166.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">基板の発振器</text><text x="155.0" y="203.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">100 MHz</text><rect x="400" y="125" width="330" height="100" fill="#CCD9F1" stroke="#231F20" stroke-width="2"/><text x="565.0" y="166.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">MMCM</text><text x="565.0" y="203.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">クロック生成回路</text><rect x="875" y="125" width="280" height="100" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="1015.0" y="166.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">CPU</text><text x="1015.0" y="203.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">20 MHz</text><polyline points="285,175 400,175" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="400,175 388.0,180.0 388.0,170.0" fill="#231F20"/><polyline points="730,175 875,175" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="875,175 863.0,180.0 863.0,170.0" fill="#231F20"/><text x="570.0" y="253.9" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">Tcl で IP の</text><text x="570.0" y="289.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">周波数などを指定</text><text x="210.0" y="345.8" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="700" fill="#231F20">Vivado が解析する条件</text><rect x="25" y="375" width="650" height="100" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="350.0" y="416.3" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">create_clock の period 10.000</text><text x="350.0" y="454.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">入力の 1 周期は 10 ns と伝える</text><polyline points="675,425 830,425" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="830,425 818.0,430.0 818.0,420.0" fill="#231F20"/><rect x="830" y="375" width="325" height="100" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="992.5" y="416.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">Vivado</text><text x="992.5" y="453.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">時間条件の解析</text><text x="600.0" y="533.8" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">この Tcl 命令自体が、FPGA 内でクロックを発生させるわけではない。</text><text x="600.0" y="581.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="700" fill="#231F20">今回の入力制約は Clocking Wizard が供給する。</text><text x="600.0" y="618.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="700" fill="#231F20">完成済みの構成へ create_clock を重複追加しない。</text></svg>