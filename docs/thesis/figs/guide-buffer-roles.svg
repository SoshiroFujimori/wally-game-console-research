<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">三つの保存場所を、保存する内容で区別する</title><desc id="desc">CPUのDDR命令配列からRasterIXへ命令が届き、内部作業領域で画素を描き、DDRの表示画像へ結果を保存する。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1673C3"/></marker></defs>
<rect width="1200" height="100%" fill="white"/>
<g font-family="Noto Sans CJK JP,Noto Sans JP,Meiryo,Yu Gothic,sans-serif" fill="#231F20">
<text x="40" y="48" font-size="29" text-anchor="start" font-weight="bold">三つの保存場所を、保存する内容で区別する</text>
<rect x="45" y="155" width="285" height="155" fill="#E5EBF8" stroke="#231F20" stroke-width="2" stroke-dasharray=""/>
<text x="187.5" y="208.55" font-size="23" text-anchor="middle" font-weight="normal">CPUの命令配列</text>
<text x="187.5" y="240.55" font-size="23" text-anchor="middle" font-weight="normal">描画の指示の数値列</text>
<text x="187.5" y="272.55" font-size="23" text-anchor="middle" font-weight="normal">DDR上</text>
<rect x="450" y="155" width="285" height="155" fill="#E5EBF8" stroke="#231F20" stroke-width="2" stroke-dasharray=""/>
<text x="592.5" y="208.55" font-size="23" text-anchor="middle" font-weight="normal">RasterIX_IF作業領域</text>
<text x="592.5" y="240.55" font-size="23" text-anchor="middle" font-weight="normal">処理中の画素の色</text>
<text x="592.5" y="272.55" font-size="23" text-anchor="middle" font-weight="normal">FPGA内</text>
<rect x="860" y="155" width="290" height="155" fill="#E5EBF8" stroke="#231F20" stroke-width="2" stroke-dasharray=""/>
<text x="1005.0" y="208.55" font-size="23" text-anchor="middle" font-weight="normal">表示用の画像A / B</text>
<text x="1005.0" y="240.55" font-size="23" text-anchor="middle" font-weight="normal">画素の色を並べた画像</text>
<text x="1005.0" y="272.55" font-size="23" text-anchor="middle" font-weight="normal">DDR上</text>
<polyline points="330,230 450,230" fill="none" stroke="#1673C3" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/>
<text x="390" y="128" font-size="20" text-anchor="middle" font-weight="normal">命令を処理</text>
<polyline points="735,230 860,230" fill="none" stroke="#1673C3" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/>
<text x="795" y="128" font-size="20" text-anchor="middle" font-weight="normal">画像を保存</text>
<polyline points="1005,310 1005,395" fill="none" stroke="#1673C3" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/>
<rect x="860" y="395" width="290" height="110" fill="#E5EBF8" stroke="#231F20" stroke-width="2" stroke-dasharray=""/>
<text x="1005.0" y="442.05" font-size="23" text-anchor="middle" font-weight="normal">表示回路が読出し</text>
<text x="1005.0" y="474.05" font-size="23" text-anchor="middle" font-weight="normal">端子へ映像信号</text>
<text x="60" y="390" font-size="23" text-anchor="start" font-weight="normal">同じDDR上でも、命令配列と画像は別の領域。</text>
<text x="60" y="422" font-size="23" text-anchor="start" font-weight="normal">内部作業領域と、前後の表示画像も別の領域。</text>
<text x="60" y="454" font-size="23" text-anchor="start" font-weight="normal"></text>
<text x="60" y="486" font-size="23" text-anchor="start" font-weight="normal">変更領域だけ描く場合は、保存画像を</text>
<text x="60" y="518" font-size="23" text-anchor="start" font-weight="normal">作業領域へ読み戻す経路も関係する。</text>
<text x="40" y="676" font-size="19" text-anchor="start" font-weight="normal">主要な保存場所の概念図。命令FIFO・テクスチャなどの保存場所は省略。</text>
</g>
</svg>
