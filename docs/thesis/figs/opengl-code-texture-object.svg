<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590"><rect width="100%" height="100%" fill="white"/><text x="600.0" y="46.15" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="700" fill="#231F20">画像を選ぶ番号と画像の内容を対応させる</text><rect x="30" y="110" width="320" height="88" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="190.0" y="163.8" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">glGenTextures</text><text x="565.0" y="163.1" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">番号を一つ取得</text><rect x="805" y="110" width="365" height="88" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="987.5" y="163.45" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">font = n</text><polyline points="350,154 380,154" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="380,154 368.0,159.0 368.0,149.0" fill="#231F20"/><polyline points="750,154 805,154" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="805,154 793.0,159.0 793.0,149.0" fill="#231F20"/><rect x="30" y="240" width="320" height="88" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="190.0" y="293.8" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">glBindTexture</text><text x="565.0" y="293.1" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">番号nを操作対象に選ぶ</text><rect x="805" y="240" width="365" height="88" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="987.5" y="293.45" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">現在の対象 = n</text><polyline points="350,284 380,284" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="380,284 368.0,289.0 368.0,279.0" fill="#231F20"/><polyline points="750,284 805,284" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="805,284 793.0,289.0 793.0,279.0" fill="#231F20"/><rect x="30" y="370" width="320" height="88" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="190.0" y="423.8" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">glTexImage2D</text><text x="565.0" y="423.1" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">寸法とRGBA配列を渡す</text><rect x="805" y="370" width="365" height="88" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="987.5" y="423.45" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">画像nの内容を登録</text><polyline points="350,414 380,414" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="380,414 368.0,419.0 368.0,409.0" fill="#231F20"/><polyline points="750,414 805,414" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="805,414 793.0,419.0 793.0,409.0" fill="#231F20"/><text x="600.0" y="546.95" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="700" fill="#1673C3">nは取得した識別番号。画像配列のアドレスではない。</text></svg>