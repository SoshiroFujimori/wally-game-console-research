<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790"><rect width="100%" height="100%" fill="white"/><text x="600.0" y="44.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="32" font-weight="700" fill="#231F20">四角形の指定が、位置と色の組を経て、描画命令になる</text><rect x="25" y="85" width="470" height="100" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="260.0" y="126.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">① glColor4ub(255, 0, 0, 255)</text><text x="260.0" y="163.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">現在の色を「赤」と覚える</text><rect x="665" y="85" width="510" height="100" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="920.0" y="126.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">② 四つの glVertex2f</text><text x="920.0" y="163.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">四つの位置を順に渡す</text><polyline points="260,185 260,238 598,238 598,276" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="598,276 593.0,264.0 603.0,264.0" fill="#231F20"/><polyline points="915,185 915,238 598,238" fill="none" stroke="#231F20" stroke-width="2"/><rect x="195" y="276" width="810" height="91" fill="#CCD9F1" stroke="#231F20" stroke-width="2"/><text x="600.0" y="312.8" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">③ 位置と色を対応させた四頂点</text><text x="600.0" y="350.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">(100, 200, 赤) … (100, 210, 赤)</text><polyline points="598,367 598,407" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="598,407 593.0,395.0 603.0,395.0" fill="#231F20"/><rect x="195" y="407" width="810" height="96" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="600.0" y="446.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">④ 四角形を二つの三角形へ組み立て</text><text x="600.0" y="483.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">設定した座標の対応に従って計算</text><polyline points="598,503 598,546" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="598,546 593.0,534.0 603.0,534.0" fill="#231F20"/><rect x="195" y="546" width="810" height="90" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="600.0" y="582.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">⑤ 回路が読み取れる命令の数値列を用意</text><text x="600.0" y="619.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">CPU 側のコマンドバッファへ保存</text><polyline points="25,669 1175,669" fill="none" stroke="#231F20" stroke-width="2" stroke-dasharray="10 7"/><text x="600.0" y="715.9" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">①〜⑤ は CPU が実行するライブラリの仕事。</text><text x="600.0" y="751.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">その後に命令を転送し、描画回路が画素を作る。glEnd は表示完了を意味しない。</text></svg>