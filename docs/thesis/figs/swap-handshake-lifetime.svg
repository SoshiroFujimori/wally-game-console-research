<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="645" viewBox="0 0 1200 645"><rect width="100%" height="100%" fill="white"/><text x="290.0" y="34.45" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">GPUCLK側</text><text x="910.0" y="34.45" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">PixelCLK側</text><polyline points="230,70 230,515" fill="none" stroke="#231F20" stroke-width="2"/><polyline points="970,70 970,515" fill="none" stroke="#231F20" stroke-width="2"/><polyline points="230,110 970,140" fill="none" stroke="#1673C3" stroke-width="2"/><polygon points="970,140 957.8073127405354,144.50980901955833 958.2123854069629,134.51801658101593" fill="#1673C3"/><text x="600.0" y="96.25" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">番地を保存して要求を上げる</text><polyline points="970,260 230,290" fill="none" stroke="#1673C3" stroke-width="2"/><polygon points="230,290 241.7876145930372,284.5180165810159 242.19268725946458,294.50980901955836" fill="#1673C3"/><text x="600.0" y="246.25" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">読出し完了を確認して返事を上げる</text><polyline points="230,375 970,405" fill="none" stroke="#1673C3" stroke-width="2"/><polygon points="970,405 957.8073127405354,409.50980901955836 958.2123854069629,399.5180165810159" fill="#1673C3"/><text x="600.0" y="361.25" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">要求を下げる</text><polyline points="970,470 230,500" fill="none" stroke="#1673C3" stroke-width="2"/><polygon points="230,500 241.7876145930372,494.5180165810159 242.19268725946458,504.50980901955836" fill="#1673C3"/><text x="600.0" y="456.25" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">返事を下げる</text><rect x="35" y="150" width="130" height="325" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="100.0" y="304.7" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">番地を</text><text x="100.0" y="338.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">保持</text><text x="600.0" y="577.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">矢印は同期を介して相手へ伝わる通知。斜め線の長さは実測時間ではない。</text><text x="600.0" y="611.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">一回の要求を終えてから次へ進み、番地と要求の対応を保つ。</text></svg>