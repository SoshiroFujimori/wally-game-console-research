<text x="610" y="180" font-size="23" text-anchor="start" font-weight="normal">青枠：図形の境界</text>
<text x="610" y="212" font-size="23" text-anchor="start" font-weight="normal">左上 (1,1)　右下 (5,4)</text>
<text x="610" y="244" font-size="23" text-anchor="start" font-weight="normal"></text>
<text x="610" y="276" font-size="23" text-anchor="start" font-weight="normal">点：各画素で調べる位置</text>
<text x="610" y="308" font-size="23" text-anchor="start" font-weight="normal">ここでは中心 (x+0.5,y+0.5)</text>
<text x="610" y="340" font-size="23" text-anchor="start" font-weight="normal"></text>
<text x="610" y="372" font-size="23" text-anchor="start" font-weight="normal">塗る画素番号：</text>
<text x="610" y="404" font-size="23" text-anchor="start" font-weight="normal">x = 1,2,3,4</text>
<text x="610" y="436" font-size="23" text-anchor="start" font-weight="normal">y = 1,2,3</text>
<text x="610" y="468" font-size="23" text-anchor="start" font-weight="normal">4 × 3 = 12画素</text>
<text x="95" y="595" font-size="23" text-anchor="start" font-weight="normal">画面の例に合わせて、yは下へ増える。</text>
<text x="40" y="676" font-size="19" text-anchor="start" font-weight="normal">明示した中心サンプルでの説明例。実装の座標変換と共有辺の規則は別途確認する。</text>
