<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">少し早く準備できても、次の切り替え機会が同じ場合</title><desc id="desc">16ms間隔の説明モデル。29msと30msの準備完了は32ms、33msは48msに切り替える。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1673C3"/></marker></defs>
<rect width="1200" height="100%" fill="white"/>
<g font-family="Noto Sans CJK JP,Noto Sans JP,Meiryo,Yu Gothic,sans-serif" fill="#231F20">
<text x="40" y="48" font-size="29" text-anchor="start" font-weight="bold">少し早く準備できても、次の切り替え機会が同じ場合</text>
<polyline points="160,130 160,465" fill="none" stroke="#CCD9F1" stroke-width="2" stroke-dasharray="6 6"/>
<text x="160" y="106" font-size="24" text-anchor="middle" font-weight="normal">0</text>
<polyline points="400,130 400,465" fill="none" stroke="#CCD9F1" stroke-width="2" stroke-dasharray="6 6"/>
<text x="400" y="106" font-size="24" text-anchor="middle" font-weight="normal">16</text>
<polyline points="640,130 640,465" fill="none" stroke="#CCD9F1" stroke-width="2" stroke-dasharray="6 6"/>
<text x="640" y="106" font-size="24" text-anchor="middle" font-weight="normal">32</text>
<polyline points="880,130 880,465" fill="none" stroke="#CCD9F1" stroke-width="2" stroke-dasharray="6 6"/>
<text x="880" y="106" font-size="24" text-anchor="middle" font-weight="normal">48</text>
<polyline points="1120,130 1120,465" fill="none" stroke="#CCD9F1" stroke-width="2" stroke-dasharray="6 6"/>
<text x="1120" y="106" font-size="24" text-anchor="middle" font-weight="normal">64</text>
<text x="1145" y="106" font-size="22" text-anchor="start" font-weight="normal">ms</text>
<text x="35" y="209" font-size="22" text-anchor="start" font-weight="normal">30 msで</text>
<text x="35" y="239" font-size="22" text-anchor="start" font-weight="normal">準備完了</text>
<polyline points="160,200 1120,200" fill="none" stroke="#231F20" stroke-width="2" stroke-dasharray=""/>
<circle cx="610" cy="200" r="7" fill="#231F20"/>
<polyline points="610,174 640,174" fill="none" stroke="#1673C3" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/>
<rect x="635" y="188" width="10" height="24" fill="#1673C3" stroke="#1673C3" stroke-width="2" stroke-dasharray=""/>
<text x="662" y="243" font-size="24" text-anchor="start" font-weight="normal">32 msで切替え</text>
<text x="35" y="319" font-size="22" text-anchor="start" font-weight="normal">29 msで</text>
<text x="35" y="349" font-size="22" text-anchor="start" font-weight="normal">準備完了</text>
<polyline points="160,310 1120,310" fill="none" stroke="#231F20" stroke-width="2" stroke-dasharray=""/>
<circle cx="595" cy="310" r="7" fill="#231F20"/>
<polyline points="595,284 640,284" fill="none" stroke="#1673C3" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/>
<rect x="635" y="298" width="10" height="24" fill="#1673C3" stroke="#1673C3" stroke-width="2" stroke-dasharray=""/>
<text x="662" y="353" font-size="24" text-anchor="start" font-weight="normal">32 msで切替え</text>
<text x="35" y="429" font-size="22" text-anchor="start" font-weight="normal">33 msで</text>
<text x="35" y="459" font-size="22" text-anchor="start" font-weight="normal">準備完了</text>
<polyline points="160,420 1120,420" fill="none" stroke="#231F20" stroke-width="2" stroke-dasharray=""/>
<circle cx="655" cy="420" r="7" fill="#231F20"/>
<polyline points="655,394 880,394" fill="none" stroke="#1673C3" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/>
<rect x="875" y="408" width="10" height="24" fill="#1673C3" stroke="#1673C3" stroke-width="2" stroke-dasharray=""/>
<text x="902" y="463" font-size="24" text-anchor="start" font-weight="normal">48 msで切替え</text>
<text x="600" y="525" font-size="24" text-anchor="middle" font-weight="normal">点：準備完了　矢印：切替え機会まで待つ　縦の青線：切替え</text>
<text x="40" y="596" font-size="19" text-anchor="start" font-weight="normal">16 msごとに切り替えられると仮定した説明例。実測値ではない。</text>
</g>
</svg>
