<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="100%" height="100%" fill="white"/><text x="600.0" y="36.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="32" font-weight="700" fill="#231F20">画像を作って表示する経路と、進行を調べる経路</text><rect x="30" y="120" width="240" height="105" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="150.0" y="164.1" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">CPU</text><text x="150.0" y="200.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">ゲームの実行</text><rect x="435" y="120" width="245" height="105" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="557.5" y="164.1" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">描画回路</text><text x="557.5" y="200.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">RasterIX</text><rect x="900" y="120" width="270" height="105" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="1035.0" y="164.1" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">表示回路</text><text x="1035.0" y="200.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">画素から映像へ</text><polyline points="270,170 435,170" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="435,170 423.0,175.0 423.0,165.0" fill="#231F20"/><text x="352.5" y="150.75" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">描画命令</text><polyline points="900,145 855,145 855,73 150,73 150,120" fill="none" stroke="#1673C3" stroke-width="2"/><polygon points="150,120 145.0,108.0 155.0,108.0" fill="#1673C3"/><text x="545.0" y="64.25" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#1673C3">切り替えの進行を通知 → CPUが回数を読む</text><rect x="400" y="320" width="400" height="95" fill="#CCD9F1" stroke="#231F20" stroke-width="2"/><text x="600.0" y="359.1" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">メモリ接続回路</text><text x="600.0" y="395.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">DDR3コントローラ</text><polyline points="150,225 150,368 400,368" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="400,368 388.0,373.0 388.0,363.0" fill="#231F20"/><text x="270.0" y="297.8" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="24" font-weight="400" fill="#231F20">プログラムなどの</text><text x="270.0" y="329.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="24" font-weight="400" fill="#231F20">読出し・書込み</text><polyline points="557,225 557,320" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="557,320 552.0,308.0 562.0,308.0" fill="#231F20"/><text x="665.0" y="273.75" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">画素の書込み</text><polyline points="1035,225 1035,368 800,368" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="800,368 812.0,363.0 812.0,373.0" fill="#231F20"/><text x="923.0" y="297.8" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="24" font-weight="400" fill="#231F20">画素の</text><text x="923.0" y="329.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="24" font-weight="400" fill="#231F20">読出し要求</text><rect x="445" y="465" width="310" height="80" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="600.0" y="514.8" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">チップ外のDDR3</text><polyline points="600,415 600,465" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="600,465 595.0,453.0 605.0,453.0" fill="#231F20"/><text x="970.0" y="466.3" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="24" font-weight="400" fill="#231F20">読出しデータは</text><text x="970.0" y="497.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="24" font-weight="400" fill="#231F20">要求元へ返る</text><polyline points="80,225 80,600" fill="none" stroke="#1673C3" stroke-width="2"/><polygon points="80,600 75.0,588.0 85.0,588.0" fill="#1673C3"/><rect x="30" y="600" width="510" height="85" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="285.0" y="651.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">CPU → UART → PCの実行記録</text><polyline points="1170,170 1185,170 1185,570 910,570 910,600" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="910,600 905.0,588.0 915.0,588.0" fill="#231F20"/><rect x="630" y="600" width="540" height="85" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="900.0" y="651.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">映像出力 → 取り込み機器 → 動画</text></svg>