ial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">A：x = 100</text><rect x="840" y="300" width="335" height="85" fill="#CCD9F1" stroke="#231F20" stroke-width="2"/><text x="1007.5" y="351.25" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">B：x = 103</text><rect x="840" y="164" width="335" height="85" fill="#FFFFFF" stroke="#1673C3" stroke-width="2"/><text x="1007.5" y="215.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">A：100を消して106へ</text><polyline points="380,275 415,275" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="415,275 403.0,280.0 403.0,270.0" fill="#231F20"/><polyline points="780,275 815,275" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="815,275 803.0,280.0 803.0,270.0" fill="#231F20"/><text x="600.0" y="456.9" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">③で消す古い位置は、Aに残る100。</text><text x="600.0" y="492.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">直前に表示したBの103だけを覚えていても、Aの古いボールは消せない。</text></svg>