<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530"><rect width="100%" height="100%" fill="white"/><text x="600.0" y="46.15" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="700" fill="#231F20">四隅の間のuとvを求める</text><rect x="100" y="145" width="500" height="260" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><polyline points="100,145 100,405" fill="none" stroke="#1673C3" stroke-width="2"/><polyline points="350,145 350,405" fill="none" stroke="#1673C3" stroke-width="2"/><polyline points="600,145 600,405" fill="none" stroke="#1673C3" stroke-width="2"/><polyline points="100,145 600,145" fill="none" stroke="#1673C3" stroke-width="2"/><polyline points="100,275 600,275" fill="none" stroke="#1673C3" stroke-width="2"/><polyline points="100,405 600,405" fill="none" stroke="#1673C3" stroke-width="2"/><ellipse cx="350.0" cy="275.0" rx="7.0" ry="7.0" fill="#231F20" stroke="#231F20" stroke-width="2"/><text x="110.0" y="113.05" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="23" font-weight="400" fill="#231F20">u=0.375</text><text x="350.0" y="113.05" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="23" font-weight="400" fill="#231F20">u=0.4375</text><text x="610.0" y="113.05" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="23" font-weight="400" fill="#231F20">u=0.5</text><rect x="740" y="170" width="415" height="185" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="947.5" y="204.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">中央の対応</text><text x="947.5" y="237.8" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">u = (0.375 + 0.5) / 2</text><text x="947.5" y="271.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">    = 0.4375</text><text x="947.5" y="305.40000000000003" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">v = (0.25 + 0.5) / 2</text><text x="947.5" y="339.20000000000005" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">    = 0.375</text><polyline points="610,275 740,275" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="740,275 728.0,280.0 728.0,270.0" fill="#231F20"/><text x="350.0" y="448.4" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="24" font-weight="400" fill="#231F20">上端 v=0.25　下端 v=0.5</text><text x="600.0" y="500.9" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="24" font-weight="400" fill="#231F20">図は連続した位置の対応。各画素で使う位置に対して座標を求める。</text></svg>