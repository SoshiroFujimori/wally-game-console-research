<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660"><rect width="100%" height="100%" fill="white"/><text x="600.0" y="44.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="32" font-weight="700" fill="#231F20">内部作業領域の大きさを、回路とソフトウェアでそろえる</text><rect x="25" y="82" width="545" height="125" fill="#CCD9F1" stroke="#231F20" stroke-width="2"/><text x="297.5" y="135.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="31" font-weight="400" fill="#231F20">回路が用意する領域</text><text x="297.5" y="175.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="31" font-weight="400" fill="#231F20">2¹⁶ = 65,536 画素</text><rect x="630" y="82" width="545" height="125" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="902.5" y="135.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="31" font-weight="400" fill="#231F20">ソフトウェアが想定する領域</text><text x="902.5" y="175.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="31" font-weight="400" fill="#231F20">2¹⁶ = 65,536 画素</text><text x="600.0" y="157.95" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="37" font-weight="700" fill="#231F20">=</text><text x="600.0" y="268.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="400" fill="#231F20">幅 640 画素 × 高さ 480 画素の画面を、5 本の帯に分ける</text><rect x="180" y="316" width="525" height="45" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="442.5" y="347.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">帯 0　640 × 96 = 61,440 画素</text><rect x="180" y="361" width="525" height="45" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="442.5" y="392.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">帯 1　640 × 96 = 61,440 画素</text><rect x="180" y="406" width="525" height="45" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="442.5" y="437.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">帯 2　640 × 96 = 61,440 画素</text><rect x="180" y="451" width="525" height="45" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="442.5" y="482.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">帯 3　640 × 96 = 61,440 画素</text><rect x="180" y="496" width="525" height="45" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="442.5" y="527.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">帯 4　640 × 96 = 61,440 画素</text><polyline points="715,316 755,316 755,361 715,361" fill="none" stroke="#231F20" stroke-width="2"/><text x="967.5" y="335.9" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">一本の帯が</text><text x="967.5" y="371.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">65,536 画素以内に収まる</text><text x="600.0" y="607.3" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="700" fill="#231F20">ソフトウェアだけ容量を増やしても、FPGA 内の記憶回路は増えない。</text></svg>