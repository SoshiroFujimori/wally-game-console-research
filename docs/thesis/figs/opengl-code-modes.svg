<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><rect width="100%" height="100%" fill="white"/><text x="600.0" y="46.15" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="700" fill="#231F20">最初の設定と描く物に応じた設定</text><rect x="35" y="100" width="345" height="275" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="207.5" y="176.75" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">起動時に一度</text><text x="207.5" y="211.85" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">座標の対応を設定</text><text x="207.5" y="246.95" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">深度テストを無効</text><text x="207.5" y="282.05" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">カリングを無効</text><text x="207.5" y="317.15000000000003" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">照明を無効</text><rect x="455" y="100" width="315" height="275" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="612.5" y="179.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">単色の四角形</text><text x="612.5" y="212.8" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20"></text><text x="612.5" y="246.60000000000002" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">テクスチャ OFF</text><text x="612.5" y="280.40000000000003" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">ブレンド OFF</text><text x="612.5" y="314.20000000000005" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">位置と色で描く</text><rect x="845" y="100" width="315" height="275" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="1002.5" y="179.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">文字の四角形</text><text x="1002.5" y="212.8" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20"></text><text x="1002.5" y="246.60000000000002" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">テクスチャ ON</text><text x="1002.5" y="280.40000000000003" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">ブレンド ON</text><text x="1002.5" y="314.20000000000005" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">模様を貼って描く</text><polyline points="380,235 455,235" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="455,235 443.0,240.0 443.0,230.0" fill="#231F20"/><polyline points="770,235 845,235" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="845,235 833.0,240.0 833.0,230.0" fill="#231F20"/><text x="597.5" y="439.4" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">glEnableで有効にし、glDisableで無効にする</text><text x="597.5" y="474.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">設定は、その後の描画で使われる</text></svg>