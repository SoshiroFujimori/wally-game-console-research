<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450"><rect width="100%" height="100%" fill="white"/><rect x="25" y="75" width="350" height="220" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="200.0" y="130.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="700" fill="#231F20">1　番地の対応</text><text x="200.0" y="212.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">プログラムの仮想番地</text><text x="200.0" y="246.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">回路へ渡す物理番地</text><rect x="425" y="75" width="350" height="220" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="600.0" y="130.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="700" fill="#231F20">2　領域の所有者</text><text x="600.0" y="212.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">Linuxが配る領域</text><text x="600.0" y="246.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">画像を置く予約領域</text><rect x="825" y="75" width="350" height="220" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="1000.0" y="130.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="700" fill="#231F20">3　見える値</text><text x="1000.0" y="212.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">CPUのキャッシュ</text><text x="1000.0" y="246.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">DDR3に保存した値</text><text x="600.0" y="359.7" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">予約は上書きの衝突を防ぐ。仮想番地の変換やキャッシュの整合は別に考える。</text><text x="600.0" y="393.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">今回の命令はCPUがMMIOへコピーする。命令バッファの直接DMAではない。</text></svg>