<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="565" viewBox="0 0 1200 565"><rect width="100%" height="100%" fill="white"/><text x="600.0" y="43.349999999999994" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="31" font-weight="700" fill="#231F20">同じ状態列を使い、描き方だけを選んで比べる</text><rect x="325" y="90" width="550" height="85" fill="#CCD9F1" stroke="#231F20" stroke-width="2"/><text x="600.0" y="142.3" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">同じ実行ファイル・周波数・画面サイズ</text><rect x="25" y="255" width="345" height="88" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="197.5" y="308.45" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">毎回全体を描く</text><polyline points="600,175 600,218 197,218 197,255" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="197,255 192.0,243.0 202.0,243.0" fill="#231F20"/><text x="197.5" y="401.9" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">同じ180状態を処理</text><text x="197.5" y="437.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">同じ条件を3試行</text><rect x="427" y="255" width="345" height="88" fill="#CCD9F1" stroke="#231F20" stroke-width="2"/><text x="599.5" y="308.45" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">呼び出しをまとめる</text><polyline points="600,175 600,218 599,218 599,255" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="599,255 594.0,243.0 604.0,243.0" fill="#231F20"/><text x="599.5" y="401.9" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">同じ180状態を処理</text><text x="599.5" y="437.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">同じ条件を3試行</text><rect x="829" y="255" width="345" height="88" fill="#77A3DC" stroke="#231F20" stroke-width="2"/><text x="1001.5" y="308.45" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">変更領域だけ描く</text><polyline points="600,175 600,218 1001,218 1001,255" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="1001,255 996.0,243.0 1006.0,243.0" fill="#231F20"/><text x="1001.5" y="401.9" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">同じ180状態を処理</text><text x="1001.5" y="437.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">同じ条件を3試行</text><text x="600.0" y="493.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">序盤・中盤・終盤をそれぞれ比較する。</text><text x="600.0" y="530.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">各最終画像が一致することを確かめてから、時間の差を読む。</text></svg>