<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610"><rect width="100%" height="100%" fill="white"/><text x="600.0" y="44.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="32" font-weight="700" fill="#231F20">何の完了を確かめたかで、言えることが違う</text><rect x="25" y="85" width="400" height="107" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="225.0" y="148.3" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">① 一語を受け取った</text><rect x="475" y="85" width="685" height="107" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="817.5" y="130.1" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">PREADY が 1 の受渡し</text><text x="817.5" y="166.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">今回の 32 bit が受け取られた</text><polyline points="425,138 475,138" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="475,138 463.0,143.0 463.0,133.0" fill="#231F20"/><rect x="25" y="235" width="400" height="107" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="225.0" y="298.3" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">② 画像を作る処理が進んだ</text><rect x="475" y="235" width="685" height="107" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="817.5" y="280.1" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">命令を解釈し、図形を塗り、画素を保存</text><text x="817.5" y="316.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">CPU の書込み完了だけでは判断できない</text><polyline points="425,288 475,288" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="475,288 463.0,293.0 463.0,283.0" fill="#231F20"/><rect x="25" y="385" width="400" height="107" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="225.0" y="448.3" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">③ 表示先の切替えが完了した</text><rect x="475" y="385" width="685" height="107" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="817.5" y="430.1" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">FrameCount の増加を確認</text><text x="817.5" y="466.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">旧画像を再利用できる条件が成立した</text><polyline points="425,438 475,438" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="475,438 463.0,443.0 463.0,433.0" fill="#231F20"/><text x="600.0" y="541.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">これらの処理は一部を重ねて進められる。図の間隔は所要時間を表さない。</text><text x="600.0" y="578.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">③ の回数から、ディスプレイに実際に見えた回数までは断定しない。</text></svg>