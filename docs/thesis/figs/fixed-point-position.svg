<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580"><rect width="100%" height="100%" fill="white"/><text x="600.0" y="44.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="32" font-weight="700" fill="#231F20">小数の位置を、256 倍した整数として保存する</text><text x="600.0" y="107.85" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="31" font-weight="700" fill="#231F20">例：位置 100.5 から、0.5 だけ右へ動かす</text><rect x="25" y="175" width="300" height="105" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="175.0" y="218.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="31" font-weight="400" fill="#231F20">位置 100.5</text><text x="175.0" y="258.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="31" font-weight="400" fill="#231F20">× 256</text><rect x="440" y="175" width="320" height="105" fill="#CCD9F1" stroke="#231F20" stroke-width="2"/><text x="600.0" y="218.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="31" font-weight="400" fill="#231F20">保存する整数</text><text x="600.0" y="258.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="31" font-weight="400" fill="#231F20">25,728</text><polyline points="325,227 440,227" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="440,227 428.0,232.0 428.0,222.0" fill="#231F20"/><rect x="875" y="175" width="300" height="105" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="1025.0" y="218.8" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">0.5 × 256</text><text x="1025.0" y="256.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">= 128 を加える</text><polyline points="760,227 875,227" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="875,227 863.0,232.0 863.0,222.0" fill="#231F20"/><polyline points="1025,280 1025,350 725,350 725,402" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="725,402 720.0,390.0 730.0,390.0" fill="#231F20"/><rect x="475" y="402" width="500" height="91" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="725.0" y="438.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="400" fill="#231F20">更新後の位置</text><text x="725.0" y="477.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="400" fill="#231F20">25,856 ÷ 256 = 101.0</text><text x="225.0" y="442.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="700" fill="#231F20">25,728 + 128</text><text x="225.0" y="481.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="700" fill="#231F20">= 25,856</text><text x="600.0" y="552.3" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">整数のまま計算しても、1/256 刻みの位置を表せる。</text></svg>