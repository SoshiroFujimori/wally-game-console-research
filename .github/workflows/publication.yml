name: Publication checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  privacy-and-references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-publication.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/publication/check.py --public
      - run: python tools/publication/check_references.py
      - run: python tools/publication/manifest.py --check
