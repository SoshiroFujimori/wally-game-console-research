<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="1330" viewBox="0 0 1420 1330" role="img" aria-labelledby="title desc">
<title id="title">FPGAチップ内の信号接続とチップ外の部品</title>
<desc id="desc">薄い地色のFPGAボードの中に，太枠と濃い地色のFPGAチップを置き，さらにその内部に白い箱の回路を置く．チップ内にCPU，アドレスデコーダ，読出しデータの選択回路，SD制御，DDR制御，描画命令の接続回路，描画・表示回路を置く．アドレスA，書込みデータD，書込み指示Wを各回路へ分岐し，選択信号で読書き先とCPUへ返す値を選ぶ．チップ外のSDカードスロット，DDR3メモリ，HDMI端子は対応する回路へ接続する．転送のタイミング制御を省略した概念図である．</desc>
