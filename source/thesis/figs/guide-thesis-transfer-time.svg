<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="595" viewBox="0 0 1200 595" role="img" aria-labelledby="title desc">
<title id="title">送信時間の一部が、APBで完了を待つ時間</title><desc id="desc">CPUが送信処理を実行する全区間と、そこに含まれるAPB待ち周期を分ける。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1673C3"/></marker></defs>
<rect width="1200" height="100%" fill="white"/>
<g font-family="Noto Sans CJK JP,Noto Sans JP,Meiryo,Yu Gothic,sans-serif" fill="#231F20">
<text x="40" y="48" font-size="29" text-anchor="start" font-weight="bold">送信時間の一部が、APBで完了を待つ時間</text>
<text x="50" y="110" font-size="25" text-anchor="start" font-weight="bold">CPU側で測る、送信の開始から終了まで</text>
<rect x="60" y="145" width="1080" height="110" fill="#E5EBF8" stroke="#231F20" stroke-width="2" stroke-dasharray=""/>
<text x="600.0" y="208.75" font-size="25" text-anchor="middle" font-weight="normal">配列から読む → 書く → 待つ → 次の語へ進む、を繰り返す</text>
<text x="50" y="320" font-size="25" text-anchor="start" font-weight="normal">その中で、APBの完了を待った周期だけを回路で数える</text>
<polyline points="75,395 1135,395" fill="none" stroke="#231F20" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/>
<rect x="170" y="350" width="95" height="90" fill="#CCD9F1" stroke="#231F20" stroke-width="2" stroke-dasharray=""/>
<text x="217.5" y="404.1" font-size="26" text-anchor="middle" font-weight="normal">待ち</text>
<rect x="365" y="350" width="140" height="90" fill="#CCD9F1" stroke="#231F20" stroke-width="2" stroke-dasharray=""/>
<text x="435.0" y="404.1" font-size="26" text-anchor="middle" font-weight="normal">待ち</text>
<rect x="625" y="350" width="90" height="90" fill="#CCD9F1" stroke="#231F20" stroke-width="2" stroke-dasharray=""/>
<text x="670.0" y="404.1" font-size="26" text-anchor="middle" font-weight="normal">待ち</text>
<rect x="880" y="350" width="160" height="90" fill="#CCD9F1" stroke="#231F20" stroke-width="2" stroke-dasharray=""/>
<text x="960.0" y="404.1" font-size="26" text-anchor="middle" font-weight="normal">待ち</text>
<polyline points="60,338 60,455" fill="none" stroke="#231F20" stroke-width="2" stroke-dasharray="5 5"/>
<polyline points="1140,338 1140,455" fill="none" stroke="#231F20" stroke-width="2" stroke-dasharray="5 5"/>
<text x="600" y="510" font-size="25" text-anchor="middle" font-weight="normal">下段の待ちを上段へ足すと、同じ時間を二度数えてしまう。</text>
<text x="40" y="571" font-size="19" text-anchor="start" font-weight="normal">青い箱はAPBの待ち。箱の個数と長さは説明用であり、測定波形ではない。</text>
</g>
</svg>
