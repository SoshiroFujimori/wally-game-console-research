<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850"><rect width="100%" height="100%" fill="white"/><text x="600.0" y="38.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="700" fill="#231F20">試験時間の確認と、一回の表示処理の完了待ち</text><rect x="40" y="90" width="630" height="85" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="355.0" y="141.25" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">初期描画4回 → 開始時刻を記録 → frames = 0</text><polyline points="355,175 355,225" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="355,225 350.0,213.0 360.0,213.0" fill="#231F20"/><rect x="40" y="225" width="630" height="90" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="355.0" y="280.15" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">経過時間が300秒以上かを調べる</text><polyline points="670,270 820,270" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="820,270 808.0,275.0 808.0,265.0" fill="#231F20"/><text x="742.5" y="246.4" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="24" font-weight="400" fill="#1673C3">300秒以上</text><rect x="820" y="225" width="340" height="100" fill="#CCD9F1" stroke="#231F20" stroke-width="2"/><text x="990.0" y="266.9" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">繰返しを終える</text><text x="990.0" y="302.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">結果の文字列を出す</text><polyline points="355,315 355,390" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="355,390 350.0,378.0 360.0,378.0" fill="#231F20"/><text x="482.5" y="361.75" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#1673C3">まだ300秒未満</text><rect x="40" y="390" width="630" height="85" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="355.0" y="441.95" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">経過した時間に応じてゲーム状態を進める</text><polyline points="355,475 355,525" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="355,525 350.0,513.0 360.0,513.0" fill="#231F20"/><rect x="40" y="525" width="630" height="100" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="355.0" y="566.9" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">present：描画を依頼し、回路の回数が</text><text x="355.0" y="602.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">変わるまで待ち、エラーを確認する</text><text x="950.0" y="547.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#1673C3">ここで一回の完了を待つ。</text><text x="950.0" y="580.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#1673C3">進行しない場合の期限は30秒。</text><polyline points="670,575 730,575" fill="none" stroke="#1673C3" stroke-width="2"/><polyline points="355,625 355,680" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="355,680 350.0,668.0 360.0,668.0" fill="#231F20"/><rect x="40" y="680" width="630" height="75" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="355.0" y="727.3" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">正常に戻ったら frames を1増やす</text><polyline points="40,718 15,718 15,270 40,270" fill="none" stroke="#1673C3" stroke-width="2"/><polygon points="40,270 28.0,275.0 28.0,265.0" fill="#1673C3"/><text x="970.0" y="722.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#1673C3">次の周回の先頭で</text><text x="970.0" y="755.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#1673C3">試験時間を再び調べる</text><text x="600.0" y="821.95" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">一回が終わる条件と、試験全体を終える条件は別々にある。</text></svg>