<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">回路の準備とソフトウェアの起動は別の段階</title><desc id="desc">クロック、DDR、CPU、起動ソフトウェア、Linux、ゲームという依存関係を示す。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1673C3"/></marker></defs>
<rect width="1200" height="100%" fill="white"/>
<g font-family="Noto Sans CJK JP,Noto Sans JP,Meiryo,Yu Gothic,sans-serif" fill="#231F20">
<text x="40" y="48" font-size="29" text-anchor="start" font-weight="bold">回路の準備とソフトウェアの起動は別の段階</text>
<rect x="40" y="140" width="320" height="110" fill="#E5EBF8" stroke="#231F20" stroke-width="2" stroke-dasharray=""/>
<text x="200.0" y="203.05" font-size="23" text-anchor="middle" font-weight="normal">基板のクロック</text>
<polyline points="360,195 440,195" fill="none" stroke="#1673C3" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/>
<rect x="440" y="140" width="320" height="110" fill="#E5EBF8" stroke="#231F20" stroke-width="2" stroke-dasharray=""/>
<text x="600.0" y="203.05" font-size="23" text-anchor="middle" font-weight="normal">クロック生成が安定</text>
<polyline points="760,195 840,195" fill="none" stroke="#1673C3" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/>
<rect x="840" y="140" width="320" height="110" fill="#E5EBF8" stroke="#231F20" stroke-width="2" stroke-dasharray=""/>
<text x="1000.0" y="203.05" font-size="23" text-anchor="middle" font-weight="normal">DDR3の準備が完了</text>
<rect x="40" y="365" width="320" height="110" fill="#E5EBF8" stroke="#231F20" stroke-width="2" stroke-dasharray=""/>
<text x="200.0" y="428.05" font-size="23" text-anchor="middle" font-weight="normal">CPUが起動処理を開始</text>
<polyline points="360,420 440,420" fill="none" stroke="#1673C3" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/>
<rect x="440" y="365" width="320" height="110" fill="#E5EBF8" stroke="#231F20" stroke-width="2" stroke-dasharray=""/>
<text x="600.0" y="428.05" font-size="23" text-anchor="middle" font-weight="normal">Linuxが動作</text>
<polyline points="760,420 840,420" fill="none" stroke="#1673C3" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/>
<rect x="840" y="365" width="320" height="110" fill="#E5EBF8" stroke="#231F20" stroke-width="2" stroke-dasharray=""/>
<text x="1000.0" y="428.05" font-size="23" text-anchor="middle" font-weight="normal">描画プログラムが動作</text>
<polyline points="1000,250 1000,305 200,305 200,365" fill="none" stroke="#1673C3" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/>
<text x="600" y="555" font-size="24" text-anchor="middle" font-weight="normal">前段の成功だけでは、後段の成功まで確認したことにならない。</text>
<text x="40" y="626" font-size="19" text-anchor="start" font-weight="normal">依存関係の概略。CPUリセット解除などの正確な条件は各実装を確認する。</text>
</g>
</svg>
