<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">同じ番地への書込みでも、行き先で意味が違う</title><desc id="desc">RAMは内容を上書きしCMDレジスタは各書込みで一語を投入する。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1673C3"/></marker></defs>
<rect width="1200" height="100%" fill="white"/>
<g font-family="Noto Sans CJK JP,Noto Sans JP,Meiryo,Yu Gothic,sans-serif" fill="#231F20">
<text x="40" y="48" font-size="29" text-anchor="start" font-weight="bold">同じ番地への書込みでも、行き先で意味が違う</text>
<text x="55" y="125" font-size="27" text-anchor="start" font-weight="normal">CPUの操作： Aを書込む → Bを書込む → Cを書込む</text>
<rect x="60" y="180" width="250" height="120" fill="#E5EBF8" stroke="#231F20" stroke-width="2" stroke-dasharray=""/>
<text x="185.0" y="231.9" font-size="24" text-anchor="middle" font-weight="normal">通常のRAM</text>
<text x="185.0" y="264.9" font-size="24" text-anchor="middle" font-weight="normal">同じ一つの番地</text>
<polyline points="310,240 455,240" fill="none" stroke="#1673C3" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/>
<rect x="455" y="180" width="255" height="120" fill="#E5EBF8" stroke="#231F20" stroke-width="2" stroke-dasharray=""/>
<text x="582.5" y="231.9" font-size="24" text-anchor="middle" font-weight="normal">内容を順に上書き</text>
<text x="582.5" y="264.9" font-size="24" text-anchor="middle" font-weight="normal">A → B → C</text>
<rect x="865" y="180" width="275" height="120" fill="#CCD9F1" stroke="#231F20" stroke-width="2" stroke-dasharray=""/>
<text x="1002.5" y="231.9" font-size="24" text-anchor="middle" font-weight="normal">最後に残るもの</text>
<text x="1002.5" y="264.9" font-size="24" text-anchor="middle" font-weight="normal">C</text>
<polyline points="710,240 865,240" fill="none" stroke="#1673C3" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/>
<rect x="60" y="355" width="250" height="120" fill="#E5EBF8" stroke="#231F20" stroke-width="2" stroke-dasharray=""/>
<text x="185.0" y="406.9" font-size="24" text-anchor="middle" font-weight="normal">CMDレジスタ</text>
<text x="185.0" y="439.9" font-size="24" text-anchor="middle" font-weight="normal">同じ命令口の番地</text>
<polyline points="310,415 455,415" fill="none" stroke="#1673C3" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/>
<rect x="455" y="355" width="255" height="120" fill="#E5EBF8" stroke="#231F20" stroke-width="2" stroke-dasharray=""/>
<text x="582.5" y="406.9" font-size="24" text-anchor="middle" font-weight="normal">書込みごとに投入</text>
<text x="582.5" y="439.9" font-size="24" text-anchor="middle" font-weight="normal">A、B、Cの三語</text>
<polyline points="710,415 865,415" fill="none" stroke="#1673C3" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/>
<rect x="865" y="355" width="275" height="120" fill="#CCD9F1" stroke="#231F20" stroke-width="2" stroke-dasharray=""/>
<text x="1002.5" y="406.9" font-size="24" text-anchor="middle" font-weight="normal">出口で受け取る列</text>
<text x="1002.5" y="439.9" font-size="24" text-anchor="middle" font-weight="normal">A → B → C</text>
<text x="40" y="596" font-size="19" text-anchor="start" font-weight="normal">A、B、Cは語の順序を表す説明用の名前。FIFOの物理的な並びは省略。</text>
</g>
</svg>
