<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="100%" height="100%" fill="white"/><text x="600.0" y="38.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="700" fill="#231F20">画像をコピーするのではなく、読む保存場所を変える</text><text x="285.0" y="110.15" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="700" fill="#231F20">① Aを表示している間</text><rect x="30" y="155" width="510" height="340" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="285.0" y="192.1" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">DDR3の中の二つの保存場所</text><rect x="60" y="230" width="450" height="95" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="285.0" y="269.1" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">画像Aの領域</text><text x="285.0" y="305.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">表示側が読む</text><rect x="60" y="365" width="450" height="95" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="285.0" y="404.1" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">画像Bの領域</text><text x="285.0" y="440.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">描画側が用意する</text><text x="915.0" y="110.15" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="700" fill="#231F20">② Bへ切り替えた後</text><rect x="660" y="155" width="510" height="340" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="915.0" y="192.1" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">DDR3の中の二つの保存場所</text><rect x="690" y="230" width="450" height="95" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="915.0" y="269.1" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">画像Aの領域</text><text x="915.0" y="305.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">次の描画に使える</text><rect x="690" y="365" width="450" height="95" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="915.0" y="404.1" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">画像Bの領域</text><text x="915.0" y="440.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">表示側が読む</text><polyline points="550,317 650,317" fill="none" stroke="#1673C3" stroke-width="2"/><polygon points="650,317 638.0,322.0 638.0,312.0" fill="#1673C3"/><text x="600.0" y="260.3" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="24" font-weight="400" fill="#1673C3">読出し先</text><text x="600.0" y="291.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="24" font-weight="400" fill="#1673C3">を切替</text><text x="600.0" y="557.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">AもBも、画面一枚分の画素を保存する領域。</text><text x="600.0" y="591.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">表示側の古い読出しが残っていないことを確認してから再利用する。</text></svg>