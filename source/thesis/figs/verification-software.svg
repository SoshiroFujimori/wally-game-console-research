<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><rect width="100%" height="100%" fill="white"/><text x="282.5" y="40.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="700" fill="#231F20">CPUが実行するプログラム</text><text x="917.5" y="40.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="700" fill="#231F20">表示と通知の回路</text><rect x="30" y="85" width="480" height="85" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="270.0" y="119.4" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">切り替え前の回数を読む</text><text x="270.0" y="154.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">previous = 100</text><rect x="700" y="85" width="470" height="85" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="935.0" y="137.3" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">FrameCount = 100</text><polyline points="700,127 510,127" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="510,127 522.0,122.0 522.0,132.0" fill="#231F20"/><text x="604.5" y="107.9" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="24" font-weight="400" fill="#231F20">MMIO読出し</text><rect x="30" y="235" width="480" height="85" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="270.0" y="269.7" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">描画命令リストの処理を進める</text><text x="270.0" y="303.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">swapDisplayList()</text><polyline points="270,170 270,235" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="270,235 265.0,223.0 275.0,223.0" fill="#231F20"/><polyline points="510,278 700,278" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="700,278 688.0,283.0 688.0,273.0" fill="#231F20"/><text x="605.0" y="255.75" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">処理の依頼</text><rect x="700" y="235" width="470" height="100" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="935.0" y="276.9" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">新画像の読出しを確認</text><text x="935.0" y="312.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">完了をCPU側へ通知</text><rect x="700" y="410" width="470" height="85" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="935.0" y="462.3" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">FrameCount = 101</text><polyline points="935,335 935,410" fill="none" stroke="#1673C3" stroke-width="2"/><polygon points="935,410 930.0,398.0 940.0,398.0" fill="#1673C3"/><rect x="30" y="410" width="480" height="100" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="270.0" y="452.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">回数を繰り返し読む</text><text x="270.0" y="486.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">100から変わったら待ちを終える</text><polyline points="270,320 270,410" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="270,410 265.0,398.0 275.0,398.0" fill="#231F20"/><polyline points="700,453 510,453" fill="none" stroke="#1673C3" stroke-width="2"/><polygon points="510,453 522.0,448.0 522.0,458.0" fill="#1673C3"/><text x="605.0" y="434.4" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="24" font-weight="400" fill="#1673C3">MMIO読出し</text><rect x="30" y="575" width="480" height="85" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="270.0" y="609.7" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">エラーがないことを確認</text><text x="270.0" y="643.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">ソフトウェアのframesを1増やす</text><polyline points="270,510 270,575" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="270,575 265.0,563.0 275.0,563.0" fill="#231F20"/><text x="932.5" y="591.9" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">回路の回数とプログラムの回数は</text><text x="932.5" y="627.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">保存場所も開始点も異なる</text></svg>