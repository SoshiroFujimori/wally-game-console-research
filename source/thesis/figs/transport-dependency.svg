<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="100%" height="100%" fill="white"/><text x="600.0" y="42.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="32" font-weight="700" fill="#231F20">未変更の内部DMAで再現した待ちの輪</text><rect x="355" y="115" width="490" height="115" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="600.0" y="147.8" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">① 描画回路</text><text x="600.0" y="181.60000000000002" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">画像のデータが届くまで</text><text x="600.0" y="215.40000000000003" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">命令を受け取れない</text><rect x="720" y="380" width="400" height="125" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="920.0" y="418.75" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">② 命令DMA</text><text x="920.0" y="451.25" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">描画側が止まり、読み出し応答を</text><text x="920.0" y="483.75" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">受け取り続けられない</text><rect x="75" y="380" width="450" height="125" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="300.0" y="418.75" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">③ メモリの共通応答経路</text><text x="300.0" y="451.25" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">先頭の命令データが残るため、</text><text x="300.0" y="483.75" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">後ろの画像データを返せない</text><polyline points="845,170 930,170 930,380" fill="none" stroke="#1673C3" stroke-width="2"/><polygon points="930,380 925.0,368.0 935.0,368.0" fill="#1673C3"/><polyline points="720,440 525,440" fill="none" stroke="#1673C3" stroke-width="2"/><polygon points="525,440 537.0,435.0 537.0,445.0" fill="#1673C3"/><polyline points="280,380 280,170 355,170" fill="none" stroke="#1673C3" stroke-width="2"/><polygon points="355,170 343.0,175.0 343.0,165.0" fill="#1673C3"/><text x="797.5" y="575.9" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="24" font-weight="400" fill="#1673C3">青矢印は、待ちが次の待ちを生む関係</text><rect x="80" y="620" width="1040" height="95" fill="#CCD9F1" stroke="#231F20" stroke-width="2"/><text x="600.0" y="659.7" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">対策候補：命令データを、バースト全体ぶん受け取れるFIFOへ保存</text><text x="600.0" y="693.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">共通の経路を空け、描画に必要な画像データを返せるようにする</text></svg>