<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490"><rect width="100%" height="100%" fill="white"/><text x="600.0" y="46.15" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="700" fill="#231F20">白い文字画像に指定色を掛け合わせる</text><text x="170.0" y="121.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="700" fill="#231F20">文字の模様</text><text x="600.0" y="121.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="700" fill="#231F20">頂点に付けた色</text><text x="1030.0" y="121.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="700" fill="#231F20">描く文字の色</text><rect x="25" y="180" width="290" height="130" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="170.0" y="236.3" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">白</text><text x="170.0" y="274.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">(1, 1, 1)</text><rect x="455" y="180" width="290" height="130" fill="#baffff" stroke="#231F20" stroke-width="2"/><text x="600.0" y="236.3" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">水色</text><text x="600.0" y="274.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">(0, 1, 1)</text><rect x="885" y="180" width="290" height="130" fill="#baffff" stroke="#231F20" stroke-width="2"/><text x="1030.0" y="236.3" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">水色</text><text x="1030.0" y="274.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">(0, 1, 1)</text><text x="385.0" y="260.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="50" font-weight="400" fill="#231F20">×</text><text x="815.0" y="260.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="50" font-weight="400" fill="#231F20">=</text><text x="600.0" y="389.7" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">R・G・Bそれぞれを掛算する。alphaも同様に掛け合わせる。</text><text x="600.0" y="423.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">文字の線のalphaは1、透明部分のalphaは0のまま残る。</text></svg>