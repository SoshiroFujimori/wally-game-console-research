<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
<title id="title">一語の受渡しと画像の完成は、別の出来事</title><desc id="desc">APB完了後も語がFIFOに残り得る。出口で受理されてから描画を進め、表示の切替えを行う。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1673C3"/></marker></defs>
<rect width="1200" height="100%" fill="white"/>
<g font-family="Noto Sans CJK JP,Noto Sans JP,Meiryo,Yu Gothic,sans-serif" fill="#231F20">
<text x="40" y="48" font-size="29" text-anchor="start" font-weight="bold">一語の受渡しと画像の完成は、別の出来事</text>
<rect x="50" y="155" width="230" height="140" fill="#E5EBF8" stroke="#231F20" stroke-width="2" stroke-dasharray=""/>
<text x="165.0" y="217.05" font-size="23" text-anchor="middle" font-weight="normal">① APB取引完了</text>
<text x="165.0" y="249.05" font-size="23" text-anchor="middle" font-weight="normal">FIFOが語を保存</text>
<polyline points="280,225 340,225" fill="none" stroke="#1673C3" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/>
<rect x="340" y="155" width="230" height="140" fill="#E5EBF8" stroke="#231F20" stroke-width="2" stroke-dasharray=""/>
<text x="455.0" y="217.05" font-size="23" text-anchor="middle" font-weight="normal">② 出口で受理</text>
<text x="455.0" y="249.05" font-size="23" text-anchor="middle" font-weight="normal">RasterIXへ渡る</text>
<polyline points="570,225 630,225" fill="none" stroke="#1673C3" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/>
<rect x="630" y="155" width="230" height="140" fill="#E5EBF8" stroke="#231F20" stroke-width="2" stroke-dasharray=""/>
<text x="745.0" y="217.05" font-size="23" text-anchor="middle" font-weight="normal">③ 描画と保存</text>
<text x="745.0" y="249.05" font-size="23" text-anchor="middle" font-weight="normal">画像を仕上げる</text>
<polyline points="860,225 920,225" fill="none" stroke="#1673C3" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/>
<rect x="920" y="155" width="230" height="140" fill="#E5EBF8" stroke="#231F20" stroke-width="2" stroke-dasharray=""/>
<text x="1035.0" y="217.05" font-size="23" text-anchor="middle" font-weight="normal">④ 表示切替え</text>
<text x="1035.0" y="249.05" font-size="23" text-anchor="middle" font-weight="normal">次の画像を選ぶ</text>
<text x="55" y="365" font-size="25" text-anchor="start" font-weight="normal">①でCPUは次の書込みへ進める場合がある。</text>
<text x="55" y="399" font-size="25" text-anchor="start" font-weight="normal">②は受取りの成立。③は必要な命令全体を処理した結果。</text>
<text x="55" y="433" font-size="25" text-anchor="start" font-weight="normal">どの完了を待つかで、ソフトウェアが再利用できる場所も違う。</text>
<text x="40" y="566" font-size="19" text-anchor="start" font-weight="normal">流れの概念図。間隔は実測時間を表さず、複数命令の重なりは省略。</text>
</g>
</svg>
