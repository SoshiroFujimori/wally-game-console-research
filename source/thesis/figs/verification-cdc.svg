<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="100%" height="100%" fill="white"/><text x="600.0" y="36.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="700" fill="#231F20">短いパルス → 保持した反転値 → CPU側の一周期の通知</text><text x="135.0" y="99.95" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#1673C3">描画側 100 MHz</text><text x="750.0" y="99.95" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#1673C3">CPU側 20 MHz</text><polyline points="280,65 280,550" fill="none" stroke="#1673C3" stroke-width="2" stroke-dasharray="10 7"/><rect x="35" y="160" width="195" height="125" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="132.5" y="214.4" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">FrameToggle</text><text x="132.5" y="249.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">0 ↔ 1</text><polygon points="35,259 48,267 35,275" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><polyline points="11,267 35,267" fill="none" stroke="#231F20" stroke-width="2"/><text x="118.5" y="314.7" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="22" font-weight="400" fill="#231F20">DDRCLK</text><rect x="355" y="160" width="170" height="125" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="440.0" y="214.4" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">FrameSync</text><text x="440.0" y="249.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">[0]</text><polygon points="355,259 368,267 355,275" fill="#FFFFFF" stroke="#231F20" stroke-width="2