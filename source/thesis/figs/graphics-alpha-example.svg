gon points="510,412 498.0,417.0 498.0,407.0" fill="#231F20"/><polyline points="840,377 925,377" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="925,377 913.0,382.0 913.0,372.0" fill="#231F20"/><rect x="1155" y="319" width="16" height="117" fill="#0000ff" stroke="#0000ff" stroke-width="2"/><rect x="20" y="475" width="380" height="55" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="210.0" y="510.55" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="23" font-weight="400" fill="#231F20">候補：赤 (1,0,0)　alpha = 0.25</text><rect x="20" y="545" width="380" height="55" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="210.0" y="581.25" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">背景：青 (0,0,1)</text><rect x="510" y="475" width="330" height="125" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="675.0" y="529.4" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">赤 × 0.25</text><text x="675.0" y="564.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">+ 青 × 0.75</text><rect x="925" y="475" width="250" height="125" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="1050.0" y="530.3" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="24" font-weight="400" fill="#231F20">(0.25, 0, 0.75)</text><text x="1050.0" y="561.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="24" font-weight="400" fill="#231F20">半透明の説明例</text><polyline points="400,503 510,503" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="510,503 498.0,508.0 498.0,498.0" fill="#231F20"/><polyline points="400,572 510,572" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="510,572 498.0,577.0 498.0,567.0" fill="#231F20"/><polyline point