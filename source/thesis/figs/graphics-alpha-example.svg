<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710"><rect width="100%" height="100%" fill="white"/><text x="600.0" y="46.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="700" fill="#231F20">同じ赤い候補色でも、alphaによって保存する色が変わる</text><text x="210.0" y="116.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="700" fill="#231F20">合成する二つの色</text><text x="675.0" y="116.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="700" fill="#231F20">色の計算</text><text x="1050.0" y="116.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="700" fill="#231F20">保存するRGB</text><rect x="20" y="155" width="380" height="55" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="210.0" y="190.55" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="23" font-weight="400" fill="#231F20">候補：赤 (1,0,0)　alpha = 1</text><rect x="20" y="225" width="380" height="55" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="210.0" y="261.25" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">背景：青 (0,0,1)</text><rect x="510" y="155" width="330" height="125" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="675.0" y="226.95" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">赤 × 1 + 青 × 0</text><rect x="925" y="155" width="250" height="125" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="1050.0" y="210.3" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="24" font-weight="400" fill="#231F20">(1, 0, 0)</text><text x="1050.0" y="241.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="24" font-weight="400" fill="#231F20">文字