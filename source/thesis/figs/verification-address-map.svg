<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690"><rect width="100%" height="100%" fill="white"/><text x="600.0" y="38.349999999999994" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="31" font-weight="700" fill="#231F20">regs[4] を読むと、回路内の完了回数が返る</text><rect x="35" y="105" width="310" height="125" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="190.0" y="158.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="400" fill="#231F20">C++の読出し</text><text x="190.0" y="197.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="400" fill="#231F20">regs[4]</text><rect x="460" y="105" width="310" height="125" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="615.0" y="159.4" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">仮想アドレス</text><text x="615.0" y="194.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">V + 4 × 4 byte</text><polyline points="345,167 460,167" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="460,167 448.0,172.0 448.0,162.0" fill="#231F20"/><text x="402.5" y="137.4" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="24" font-weight="400" fill="#231F20">添字4</text><rect x="885" y="105" width="280" height="125" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="1025.0" y="159.4" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">物理アドレス</text><text x="1025.0" y="194.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">0x10080010</text><polyline points="770,167 885,167" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="885,167 873.0,172.0 873.0,162.0" fill="#231F20"/><text x="827.5" y="124.4" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="22" font-weight="400" fill="#231F20">mmapの</text><text x="827.5" y="153.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="22" font-weight="400" fill="#231F20">対応付け</text><polyline points="1025,230 1025,265 1190,265 1190,350 770,350" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="770,350 782.0,345.0 782.0,355.0" fill="#231F20"/><rect x="460" y="290" width="310" height="120" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="615.0" y="342.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">描画用の接続回路</text><text x="615.0" y="376.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">下位8 bit = 0x10</text><text x="1000.0" y="310.9" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="24" font-weight="400" fill="#231F20">バスが周辺回路を選ぶ</text><rect x="35" y="290" width="310" height="120" fill="#CCD9F1" stroke="#231F20" stroke-width="2"/><text x="190.0" y="341.3" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">FrameCount</text><text x="190.0" y="379.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="400" fill="#231F20">例：101を保持</text><polyline points="460,350 345,350" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="345,350 357.0,345.0 357.0,355.0" fill="#231F20"/><text x="402.5" y="320.55" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="23" font-weight="400" fill="#231F20">値を選ぶ</text><polyline points="190,410 190,520 1025,520 1025,580" fill="none" stroke="#1673C3" stroke-width="2"/><polygon points="1025,580 1020.0,568.0 1030.0,568.0" fill="#1673C3"/><rect x="800" y="580" width="365" height="80" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="982.5" y="629.8" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">CPUへ101が返る</text><text x="612.5" y="499.45" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#1673C3">PRDATA → バスの読出し応答</text><text x="372.5" y="602.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">Vはmmapが返す仮想アドレス。</text><text x="372.5" y="635.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">画素の保存場所A・Bへの読出しではない。</text></svg>