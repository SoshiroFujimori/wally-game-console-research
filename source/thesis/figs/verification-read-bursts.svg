<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="100%" height="100%" fill="white"/><text x="600.0" y="38.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="700" fill="#231F20">一件の読出し要求に、複数回のデータ転送が対応する</text><text x="600.0" y="105.95" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">説明例：先頭番地Bから、四つのデータを要求する</text><text x="135.0" y="186.9" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="700" fill="#231F20">番地を渡す</text><text x="135.0" y="222.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="700" fill="#231F20">要求側</text><text x="135.0" y="376.9" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="700" fill="#231F20">データが返る</text><text x="135.0" y="412.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="700" fill="#231F20">応答側</text><rect x="275" y="125" width="280" height="125" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="415.0" y="163.75" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">先頭番地B</text><text x="415.0" y="196.25" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">ARVALID = 1</text><text x="415.0" y="228.75" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">ARREADY = 1</text><polyline points="415,250 415,300 1085,300" fill="none" stroke="#1673C3" stroke-width="2"/><polygon points="1085,300 1073.0,305.0 1073.0,295.0" fill="#1673C3"/><text x="845.0" y="277.75" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#1673C3">受理されてから、データが順に返る</text><rect x="275" y="350" width="200" height="110" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="375.0" y="397.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">データ1</text><text x="375.0" y="431.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">RLAST = 0</text><polyline points="475,405 497,405" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="497,405 485.0,410.0 485.0,400.0" fill="#231F20"/><rect x="500" y="350" width="200" height="110" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="600.0" y="397.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">データ2</text><text x="600.0" y="431.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">RLAST = 0</text><polyline points="700,405 722,405" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="722,405 710.0,410.0 710.0,400.0" fill="#231F20"/><rect x="725" y="350" width="200" height="110" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="825.0" y="397.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">データ3</text><text x="825.0" y="431.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">RLAST = 0</text><polyline points="925,405 947,405" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="947,405 935.0,410.0 935.0,400.0" fill="#231F20"/><rect x="950" y="350" width="200" height="110" fill="#CCD9F1" stroke="#231F20" stroke-width="2"/><text x="1050.0" y="397.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">データ4</text><text x="1050.0" y="431.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="400" fill="#231F20">RLAST = 1</text><text x="712.5" y="509.75" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">各データは RVALID = RREADY = 1 の立ち上がりで受け取る</text><polyline points="1050,460 1178,460 1178,565 1050,565 1050,575" fill="none" stroke="#1673C3" stroke-width="2"/><polygon points="1050,575 1045.0,563.0 1055.0,563.0" fill="#1673C3"/><text x="940.0" y="597.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="700" fill="#1673C3">ここで一件の応答が完了</text><text x="940.0" y="631.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="700" fill="#1673C3">ReadCompleted = 1</text><text x="350.0" y="597.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">四つは説明用の数。</text><text x="350.0" y="630.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">画面一枚は多数の読出し要求に分かれる。</text></svg>