<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="100%" height="100%" fill="white"/><text x="600.0" y="56.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="32" font-weight="700" fill="#231F20">同じバックバッファAの一帯分を、読み、変え、戻す</text><text x="275.0" y="116.25" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="700" fill="#231F20">基板上のDDR3　画像Aの該当する帯</text><text x="930.0" y="116.25" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="700" fill="#231F20">FPGA内のBRAM　作業領域</text><rect x="70" y="145" width="410" height="110" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="275.0" y="191.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">前に描いた色が残る</text><text x="275.0" y="228.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">白いボールは横位置100</text><rect x="730" y="145" width="400" height="110" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="930.0" y="191.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">① 古い画素を読み込む</text><text x="930.0" y="228.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="28" font-weight="400" fill="#231F20">Aと同じ色の並び</text><polyline points="495,200 715,200" fill="none" stroke="#1673C3" stroke-width="2"/><polygon points="715,200 703.0,205.0 703.0,195.0" fill="#1673C3"/><text x="605.0" y="173.9" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="24" font-weight="400" fill="#1673C3">一帯分の画素を読む</text><polyline points="930,260 930,315" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="930,315 925.0,303.0 935.0,303.0" fill="#231F20"/><rect x="730" y="330" width="400" height="12