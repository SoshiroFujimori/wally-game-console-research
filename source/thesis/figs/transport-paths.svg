<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710"><rect width="100%" height="100%" fill="white"/><text x="600.0" y="38.7" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="32" font-weight="700" fill="#231F20">CPUが一語ずつ送る方式</text><rect x="60" y="80" width="300" height="100" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="210.0" y="121.9" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">DDR3</text><text x="210.0" y="157.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">CPUが用意した命令列</text><rect x="440" y="80" width="260" height="100" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="570.0" y="121.9" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">CPU</text><text x="570.0" y="157.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">一語ずつ読み書き</text><rect x="800" y="80" width="340" height="100" fill="#CCD9F1" stroke="#231F20" stroke-width="2"/><text x="970.0" y="121.9" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">命令FIFO</text><text x="970.0" y="157.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">RasterIXへ渡す</text><polyline points="360,130 440,130" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="440,130 428.0,135.0 428.0,125.0" fill="#231F20"/><polyline points="700,130 800,130" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="800,130 788.0,135.0 788.0,125.0" fill="#231F20"/><text x="780.0" y="228.75" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">命令の語数に応じて、CPUが書き込みを繰り返す</text><text x="600.0" y="323.7" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="32" font-weight="700" fill="#231F20">DMA回路が命令列を読む方式</text><rect x="60" y="385" width="300" height="100" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="210.0" y="426.9" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">DDR3</text><text x="210.0" y="462.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">CPUが用意した命令列</text><rect x="440" y="385" width="260" height="100" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="570.0" y="426.9" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">DMA回路</text><text x="570.0" y="462.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">列を順に読む</text><rect x="800" y="385" width="340" height="100" fill="#CCD9F1" stroke="#231F20" stroke-width="2"/><text x="970.0" y="426.9" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">RasterIX</text><text x="970.0" y="462.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">命令を処理する</text><polyline points="360,435 440,435" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="440,435 428.0,440.0 428.0,430.0" fill="#231F20"/><polyline points="700,435 800,435" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="800,435 788.0,440.0 788.0,430.0" fill="#231F20"/><rect x="440" y="565" width="260" height="70" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="570.0" y="609.45" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">CPU</text><polyline points="570,565 570,485" fill="none" stroke="#1673C3" stroke-width="2"/><polygon points="570,485 575.0,497.0 565.0,497.0" fill="#1673C3"/><text x="925.0" y="580.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#1673C3">開始番地と長さを指定</text><text x="925.0" y="612.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#1673C3">終了を確認して領域を再利用</text><text x="600.0" y="685.4" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="24" font-weight="400" fill="#231F20">黒矢印は命令データ、青矢印は開始の指定</text></svg>