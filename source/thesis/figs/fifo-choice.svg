<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930"><rect width="100%" height="100%" fill="white"/><text x="600.0" y="38.349999999999994" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="31" font-weight="700" fill="#231F20">RasterIXが受け取れない間に CPUは次の語へ進めるか</text><rect x="20" y="72" width="1160" height="355" fill="#E5EBF8" stroke="#D8D8D8" stroke-width="2"/><text x="44" y="120.15" text-anchor="start" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="700" fill="#231F20">FIFOなし　Aを受け取るまで CPU側を待たせる</text><rect x="60" y="160" width="265" height="102" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="192.5" y="203.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="700" fill="#231F20">CPU側のバス回路</text><text x="192.5" y="237.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="700" fill="#231F20">Aを保持</text><rect x="458" y="160" width="240" height="102" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="578.0" y="203.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">命令の</text><text x="578.0" y="236.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">接続回路</text><rect x="830" y="160" width="300" height="102" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="980.0" y="203.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="700" fill="#231F20">RasterIX</text><text x="980.0" y="237.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="26" font-weight="700" fill="#231F20">今は受け取れない</text><polyline points="325,200 458,200" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="458,200 446.0,205.0 446.0,195.0" fill="#231F20"/><polyline points="698,200 830,200" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="830,200 818.0,205.0 818.0,195.0" fill="#231F20"/><text x="391.0" y="168.4" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="24" font-weight="400" fill="#231F20">A</text><text x="764.5" y="168.4" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="24" font-weight="400" fill="#231F20">A</text><polyline points="830,245 760,245 760,307 382,307 382,245 325,245" fill="none" stroke="#1673C3" stroke-width="2"/><polygon points="325,245 337.0,240.0 337.0,250.0" fill="#1673C3"/><text x="595.0" y="300.05" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="23" font-weight="700" fill="#1673C3">READY=0 → PREADY=0</text><text x="600.0" y="360.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">AのAPB書き込みは未完了。CPUの送信処理はBへ進めない。</text><text x="600.0" y="392.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">Aを同じ値のまま保持するので、受取待ちでAが失われることはない。</text><rect x="20" y="451" width="1160" height="365" fill="#FFFFFF" stroke="#D8D8D8" stroke-width="2"/><text x="44" y="500.15" text-anchor="start" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="29" font-weight="700" fill="#231F20">FIFOあり　空きがあれば CPUから先に預かる</text><text x="290.0" y="548.9" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="24" font-weight="400" fill="#1673C3">FIFOへの保存で書き込み完了</text><text x="996.5" y="548.9" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="24" font-weight="400" fill="#1673C3">出口のAは受取待ち</text><rect x="48" y="579" width="210" height="98" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="153.0" y="620.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="700" fill="#231F20">CPU側の</text><text x="153.0" y="653.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="700" fill="#231F20">バス回路</text><rect x="330" y="579" width="207" height="98" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="433.5" y="621.1" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="23" font-weight="400" fill="#231F20">命令の</text><text x="433.5" y="651.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="23" font-weight="400" fill="#231F20">接続回路</text><rect x="600" y="565" width="226" height="126" fill="#CCD9F1" stroke="#231F20" stroke-width="2"/><text x="713.0" y="605.2" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="24" font-weight="700" fill="#231F20">FIFO</text><text x="713.0" y="636.4000000000001" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="24" font-weight="700" fill="#231F20">A、B、Cを保存</text><text x="713.0" y="667.6000000000001" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="24" font-weight="700" fill="#231F20">Aから順に渡す</text><rect x="888" y="579" width="254" height="98" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="1015.0" y="620.8" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="24" font-weight="700" fill="#231F20">RasterIX</text><text x="1015.0" y="652.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="24" font-weight="700" fill="#231F20">今は受け取れない</text><polyline points="258,610 330,610" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="330,610 318.0,615.0 318.0,605.0" fill="#231F20"/><polyline points="330,655 258,655" fill="none" stroke="#1673C3" stroke-width="2"/><polygon points="258,655 270.0,650.0 270.0,660.0" fill="#1673C3"/><polyline points="537,610 600,610" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="600,610 588.0,615.0 588.0,605.0" fill="#231F20"/><polyline points="600,655 537,655" fill="none" stroke="#1673C3" stroke-width="2"/><polygon points="537,655 549.0,650.0 549.0,660.0" fill="#1673C3"/><polyline points="826,610 888,610" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="888,610 876.0,615.0 876.0,605.0" fill="#231F20"/><polyline points="888,655 826,655" fill="none" stroke="#1673C3" stroke-width="2"/><polygon points="826,655 838.0,650.0 838.0,660.0" fill="#1673C3"/><text x="595.0" y="748.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">Aを預けたCPUは、B、Cも順に送れる。満杯になったら待つ。</text><text x="595.0" y="780.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="25" font-weight="400" fill="#231F20">RasterIXが受け取れるようになった後、A、B、Cを順に渡す。</text><text x="600.0" y="855.15" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="23" font-weight="400" fill="#231F20">両案とも同じクロックと仮定。下段は三語分の空きがある場合。</text><text x="600.0" y="885.05" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="23" font-weight="400" fill="#231F20">黒矢印はデータ、青矢印は受取可の返事。</text><text x="600.0" y="914.9499999999999" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="23" font-weight="400" fill="#231F20">実機で異なるクロックを使う方法は7.4節で説明する。</text></svg>