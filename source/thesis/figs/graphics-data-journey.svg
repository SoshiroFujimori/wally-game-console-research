<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="100%" height="100%" fill="white"/><text x="600.0" y="46.5" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="30" font-weight="700" fill="#231F20">図形の位置から画素の色へ</text><text x="120.0" y="109.05" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="23" font-weight="700" fill="#231F20">CPU上のゲーム</text><rect x="25" y="145" width="190" height="140" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="120.0" y="208.7" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="21" font-weight="400" fill="#231F20">物体の位置を決め</text><text x="120.0" y="236.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="21" font-weight="400" fill="#231F20">四角形を指定</text><polyline points="120,285 120,345" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="120,345 115.0,333.0 125.0,333.0" fill="#231F20"/><rect x="25" y="345" width="190" height="140" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="120.0" y="408.7" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="21" font-weight="400" fill="#231F20">ゲームの変数</text><text x="120.0" y="436.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="21" font-weight="400" fill="#231F20">x = 100, y = 80</text><polyline points="215,215 265,215" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="265,215 253.0,220.0 253.0,210.0" fill="#231F20"/><text x="240.0" y="137.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="16" font-weight="400" fill="#231F20">API</text><text x="360.0" y="109.05" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="23" font-weight="700" fill="#231F20">CPU上のライブラリ</text><rect x="265" y="145" width="190" height="140" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="360.0" y="208.7" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="21" font-weight="400" fill="#231F20">頂点を変換する</text><text x="360.0" y="236.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="21" font-weight="400" fill="#231F20">描画命令を作る</text><polyline points="360,285 360,345" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="360,345 355.0,333.0 365.0,333.0" fill="#231F20"/><rect x="265" y="345" width="190" height="140" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="360.0" y="408.7" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="21" font-weight="400" fill="#231F20">命令用のメモリ</text><text x="360.0" y="436.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="21" font-weight="400" fill="#231F20">回路へ渡す数値列</text><polyline points="455,215 505,215" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="505,215 493.0,220.0 493.0,210.0" fill="#231F20"/><text x="480.0" y="137.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="16" font-weight="400" fill="#231F20">MMIO</text><text x="600.0" y="109.05" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="23" font-weight="700" fill="#231F20">FPGA内の描画回路</text><rect x="505" y="145" width="190" height="140" fill="#E5EBF8" stroke="#231F20" stroke-width="2"/><text x="600.0" y="208.7" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="21" font-weight="400" fill="#231F20">三角形の内側を</text><text x="600.0" y="236.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="21" font-weight="400" fill="#231F20">調べ、色を計算</text><polyline points="600,285 600,345" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="600,345 595.0,333.0 605.0,333.0" fill="#231F20"/><rect x="505" y="345" width="190" height="140" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="600.0" y="408.7" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="21" font-weight="400" fill="#231F20">内部作業領域</text><text x="600.0" y="436.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="21" font-weight="400" fill="#231F20">帯ごとの画素の色</text><polyline points="695,215 745,215" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="745,215 733.0,220.0 733.0,210.0" fill="#231F20"/><text x="720.0" y="137.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="16" font-weight="400" fill="#231F20">保存</text><text x="840.0" y="109.05" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="23" font-weight="700" fill="#231F20">DDRメモリ</text><rect x="745" y="145" width="190" height="140" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="840.0" y="208.7" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="21" font-weight="400" fill="#231F20">完成画像を保存</text><text x="840.0" y="236.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="21" font-weight="400" fill="#231F20">640 × 480 画素</text><polyline points="840,285 840,345" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="840,345 835.0,333.0 845.0,333.0" fill="#231F20"/><rect x="745" y="345" width="190" height="140" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="840.0" y="408.7" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="21" font-weight="400" fill="#231F20">表示用の画像</text><text x="840.0" y="436.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="21" font-weight="400" fill="#231F20">1画素 16 bit</text><polyline points="935,215 985,215" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="985,215 973.0,220.0 973.0,210.0" fill="#231F20"/><text x="960.0" y="137.6" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="16" font-weight="400" fill="#231F20">読出し</text><text x="1080.0" y="109.05" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="23" font-weight="700" fill="#231F20">FPGA内の表示回路</text><rect x="985" y="145" width="190" height="140" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="1080.0" y="208.7" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="21" font-weight="400" fill="#231F20">画像を順に読む</text><text x="1080.0" y="236.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="21" font-weight="400" fill="#231F20">映像信号を送る</text><polyline points="1080,285 1080,345" fill="none" stroke="#231F20" stroke-width="2"/><polygon points="1080,345 1075.0,333.0 1085.0,333.0" fill="#231F20"/><rect x="985" y="345" width="190" height="140" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="1080.0" y="408.7" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="21" font-weight="400" fill="#231F20">画素の順序と時刻</text><text x="1080.0" y="436.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="21" font-weight="400" fill="#231F20">一定の周期で送出</text><text x="600.0" y="543.9" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">文字画像を最初に登録するときには、画像データも送る。</text><text x="600.0" y="579.0" text-anchor="middle" font-family="Arial,Noto Sans JP,Meiryo,sans-serif" font-size="27" font-weight="400" fill="#231F20">実行中は、文字画像の参照範囲と画面上の置き場所を指定する。</text></svg>