<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">実際のクロックと、解析へ与える情報を区別する</title><desc id="desc">発振器からclk端子とクロック生成回路へ進む経路に、XDCがピンと周期の情報を与える。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1673C3"/></marker></defs>
<rect width="1200" height="100%" fill="white"/>
<g font-family="Noto Sans CJK JP,Noto Sans JP,Meiryo,Yu Gothic,sans-serif" fill="#231F20">
<text x="40" y="48" font-size="29" text-anchor="start" font-weight="bold">実際のクロックと、解析へ与える情報を区別する</text>
<rect x="35" y="160" width="240" height="130" fill="#E5EBF8" stroke="#231F20" stroke-width="2" stroke-dasharray=""/>
<text x="155.0" y="216.9" font-size="24" text-anchor="middle" font-weight="normal">基板の発振器</text>
<text x="155.0" y="249.9" font-size="24" text-anchor="middle" font-weight="normal">100 MHzの信号</text>
<rect x="360" y="160" width="205" height="130" fill="#E5EBF8" stroke="#231F20" stroke-width="2" stroke-dasharray=""/>
<text x="462.5" y="216.9" font-size="24" text-anchor="middle" font-weight="normal">FPGA端子</text>
<text x="462.5" y="249.9" font-size="24" text-anchor="middle" font-weight="normal">RTLの clk</text>
<rect x="650" y="160" width="235" height="130" fill="#E5EBF8" stroke="#231F20" stroke-width="2" stroke-dasharray=""/>
<text x="767.5" y="216.9" font-size="24" text-anchor="middle" font-weight="normal">クロック生成IP</text>
<text x="767.5" y="249.9" font-size="24" text-anchor="middle" font-weight="normal">CPU用などを生成</text>
<rect x="970" y="160" width="195" height="130" fill="#E5EBF8" stroke="#231F20" stroke-width="2" stroke-dasharray=""/>
<text x="1067.5" y="216.9" font-size="24" text-anchor="middle" font-weight="normal">内部回路</text>
<text x="1067.5" y="249.9" font-size="24" text-anchor="middle" font-weight="normal">CPUなど</text>
<polyline points="275,225 360,225" fill="none" stroke="#1673C3" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/>
<polyline points="565,225 650,225" fill="none" stroke="#1673C3" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/>
<polyline points="885,225 970,225" fill="none" stroke="#1673C3" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/>
<rect x="280" y="410" width="365" height="120" fill="#CCD9F1" stroke="#231F20" stroke-width="2" stroke-dasharray=""/>
<text x="462.5" y="461.9" font-size="24" text-anchor="middle" font-weight="normal">XDC（生成分を含む）</text>
<text x="462.5" y="494.9" font-size="24" text-anchor="middle" font-weight="normal">端子の位置と入力周期</text>
<polyline points="460,410 460,290" fill="none" stroke="#1673C3" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<rect x="715" y="410" width="400" height="120" fill="#CCD9F1" stroke="#231F20" stroke-width="2" stroke-dasharray=""/>
<text x="915.0" y="461.9" font-size="24" text-anchor="middle" font-weight="normal">IP生成Tclで設定</text>
<text x="915.0" y="494.9" font-size="24" text-anchor="middle" font-weight="normal">内部クロックの生成条件</text>
<polyline points="820,410 820,290" fill="none" stroke="#1673C3" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="40" y="626" font-size="19" text-anchor="start" font-weight="normal">実線は信号、破線は設計ツールへ与える設定。XDC自体は信号を発生しない。</text>
</g>
</svg>
